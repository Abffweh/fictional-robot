{ let t = 16.7;

const S_ = i => SUBS[i][0], E_ = i => SUBS[i][1];

/* ================= 渲染器 ================= */
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('gl'), antialias: false, preserveDrawingBuffer: true});

  uniforms: {tex:{value:null}, dir:{value:new THREE.Vector2(1,0)}, focus:{value:.5}, band:{value:.16}, amount:{value:6}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }',
  fragmentShader: `uniform sampler2D tex; uniform vec2 dir; uniform float focus, band, amount; varying vec2 vUv;

      vec2 px = dir / vec2(${W}., ${H}.) * r; vec4 c = vec4(0.); float ws = 0.;
      for (int i=-6; i<=6; i++){ float w = exp(-float(i*i)/18.); c += texture2D(tex, vUv + px*float(i)) * w; ws += w; }
      gl_FragColor = c / ws; }`, depthTest: false });

  uniforms: {tex:{value:null}, time:{value:0}, fade:{value:1}},

  fragmentShader: `uniform sampler2D tex; uniform float time, fade; varying vec2 vUv;

    void main(){ vec3 c = texture2D(tex, vUv).rgb;

/* ================= 材质与道具 ================= */
const matCache = {};
function clay(color, opts={}){
  const k = color + JSON.stringify(opts);
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial({color, roughness: opts.r ?? .88, metalness: 0,
    emissive: opts.emissive || '#000000', emissiveIntensity: opts.ei ?? 1, transparent: !!opts.transparent, opacity: opts.opacity ?? 1});

}
const TEXDRAW = [];
function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const job = () => { const g = cv.getContext('2d'); g.clearRect(0,0,w,h); draw(g, w, h); tex.needsUpdate = true; };
  job(); TEXDRAW.push(job); return tex;
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

    g.beginPath(); const y = r()*h; g.moveTo(0,y); for (let x=0;x<=w;x+=64) g.lineTo(x, y+Math.sin(x*.01+i)*6); g.stroke(); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(30, 8);

/* ---------- 模拟 1：排队（N 条队，每人前面 4 个顾客，慢顾客随机出现） ---------- */
function mc(nl, runs, seed){
  const r = mulberry32(seed), out = [], wins = Array(nl).fill(0), cum = [];
  for (let k=0;k<runs;k++){
    const slow = [], tot = [];
    for (let l=0;l<nl;l++){ const s = []; let T = 0;
      for (let i=0;i<4;i++){ const sl = r() < .25; s.push(sl); T += sl ? 3 + 2*r() : 1 + .5*r(); }
      slow.push(s); tot.push(T); }
    const win = tot.indexOf(Math.min(...tot)); wins[win]++; cum.push(wins.slice()); out.push({slow, tot, win});
  }
  return {runs: out, wins, cum, pct: wins[1]/runs*100};
}
const MC3 = mc(3, 1000, 2026), MC4 = mc(4, 1000, 4202);
if (Math.abs(MC3.pct - 100/3) > 3 || Math.abs(MC4.pct - 25) > 3) throw new Error(`排队模拟与字幕不一致 ${MC3.pct} ${MC4.pct}`);

/* ---------- 模拟 2：两条车道（走走停停，平均一样快） ---------- */
const HW = (()=>{
  const V0 = 3.2, a = .5, lam = 26, h = 1.45, x0 = -120, dx = .02, N = 26000;
  const vA = x => V0*(1 + a*Math.sin(2*Math.PI*x/lam)), vB = x => V0*(1 - a*Math.sin(2*Math.PI*x/lam));
  const mk = v => { const T = new Float64Array(N); for (let i=1;i<N;i++){ const x = x0 + (i-.5)*dx; T[i] = T[i-1] + dx/v(x); } return T; };
  const TA = mk(vA), TB = mk(vB);
  const Tof = (T, x) => { const f = (x - x0)/dx, i = clamp(Math.floor(f), 0, N-2); return T[i] + (T[i+1]-T[i])*(f-i); };
  const Xof = (T, tau) => { let lo = 0, hi = N-1; if (tau <= T[0]) return x0; if (tau >= T[N-1]) return x0 + (N-1)*dx;
    while (hi - lo > 1){ const m = (lo+hi) >> 1; if (T[m] <= tau) lo = m; else hi = m; } return x0 + (lo + (tau - T[lo])/(T[hi]-T[lo]))*dx; };
  const period = lam / (V0*Math.sqrt(1 - a*a));
  return {V0, a, lam, h, vA, vB, TA, TB, Tof, Xof, period};
})();
/* 模拟时钟：段落内按固定倍速推进；"被超车"计时区间正好走完 3 个整周期 */
const HWT = (()=>{
  const r1 = 3*HW.period / (E_(16) - S_(13));
  const segs = [[S_(10), 0], [S_(12), .6], [S_(13), r1], [E_(16) + .2, .15], [S_(26), 1.2], [END0 + 10, 1.2]];
  const s = t => { let acc = 0; for (let i=0;i<segs.length-1;i++){ const [a, r] = segs[i], b = segs[i+1][0];
      if (t <= a) return acc; acc += r * (Math.min(t, b) - a); if (t < b) return acc; } return acc; };
  // 你的车：车道 A，k = 0；起点 x = 0
  const tau0 = HW.Tof(HW.TA, 0);
  const youX = t => HW.Xof(HW.TA, tau0 + s(t));
  // "被超 / 超车" 计时：从 S13 起累计模拟时间
  const sim0 = s(S_(13)), sim1 = s(E_(16)), stepN = 6000, cumP = new Float64Array(stepN+1), cumQ = new Float64Array(stepN+1), ds = (sim1 - sim0)/stepN;
  for (let i=0;i<stepN;i++){ const x = HW.Xof(HW.TA, tau0 + sim0 + (i+.5)*ds); const passed = HW.vB(x) > HW.vA(x);
    cumP[i+1] = cumP[i] + (passed ? ds : 0); cumQ[i+1] = cumQ[i] + (passed ? 0 : ds); }
  const meter = t => { const f = clamp((s(t) - sim0)/ds, 0, stepN), i = Math.floor(f); return [cumP[i], cumQ[i]]; };
  return {s, youX, meter, final: cumP[stepN]/(cumP[stepN]+cumQ[stepN])*100};
})();
if (HWT.final < 55) throw new Error('车道模拟：被超时间并不更长，与字幕不一致');

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>为什么你说得很清楚，别人还是听不懂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@500;700&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap');

  #check .row { display: flex; align-items: center; gap: 14px; margin-top: 14px; font: 700 40px 'Noto Serif SC'; position: relative; }
  #check .box { width: 34px; height: 34px; border: 3px solid #F3E8CF; border-radius: 3px; position: relative; flex: none; }
  #check .box.on::after { content: ''; position: absolute; left: 8px; top: -6px; width: 12px; height: 26px;

  #check .box.x { border-color: #D8584A; }
  #check .box.x::before, #check .box.x::after { content: ''; position: absolute; left: 13px; top: -2px; width: 3px; height: 32px; background: #D8584A; }
  #check .box.x::before { transform: rotate(45deg); } #check .box.x::after { transform: rotate(-45deg); }

  #title .s { font: 500 30px 'Noto Serif SC'; letter-spacing: 12px; color: rgba(240,201,135,.9); }
  #title .n { font: 900 76px 'Noto Serif SC'; color: #F0C987; letter-spacing: 3px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  #title .q { font: 500 40px 'Noto Serif SC'; color: #F3E8CF; }

  #title .note { font: 500 26px 'Noto Serif SC'; color: rgba(243,232,207,.6); margin-top: 18px; }
  #hook { position: absolute; left: 0; right: 0; z-index: 25; text-align: center; font-family: 'Noto Serif SC', serif; color: #F6ECD6; pointer-events: none;
           text-shadow: 0 3px 14px rgba(15,8,3,.95), 0 0 3px rgba(15,8,3,.95); }
  #hook .t { display: inline-block; font-weight: 900; letter-spacing: 4px; }
  #hook .hc { display: inline-block; }
  #hook .g { color: #F0C987; } #hook .r { color: #EE7A62; }

<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="hookbg"></div>
  <div id="hook"><div class="t"></div><div class="u"></div></div>
  <div id="check" class="ui"></div>
  <div id="corner" class="ui"><div class="a"></div><div class="b"></div></div>
  <div id="subtitle" class="ui"></div>
  <div id="watermark" class="ui">@Leo</div>
  <div id="title"></div>
</div>
<script>
'use strict';
/* ================= 工具 ================= */
const W = 1920, H = 1080;
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t => t<.5 ? 2*t*t : 1-((-2*t+2)**2)/2;
const easeOut = t => 1-(1-t)**3;
const backOut = t => { const c = 1.9; return 1 + (c+1)*(t-1)**3 + c*(t-1)**2; };
const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0)/4294967296; }; }
const SERIF = "'Noto Serif SC', serif", SANS = "'Noto Sans SC', sans-serif", GAR = "'EB Garamond', serif";
const C = { cream:'#F3E8CF', paper:'#EFE4CF', ink:'#3A2614', gold:'#F0C987', gold2:'#E0B66A', red:'#E8735F', red2:'#B5352A',
  olive:'#7D8A4E', brown:'#7A5235', mauve:'#8A5F6B', sage:'#6F7D6A', clay:'#B98A64', skin:'#E8C6A0', wood:'#6B4428', wood2:'#8A5A35' };
const hanLen = s => s.replace(/<[^>]+>/g,'').replace(/[A-Za-z0-9.%]+/g,'A').replace(/[\s，。、；：？！“”‘’「」《》（）—…,.;:?!"'()\-]/g,'').length;

/* ================= 实验数字（Newton 1990，经 Heath & Heath, HBR 2006 转述） ================= */
const TAP = { songs: 120, hits: 3, predicted: 50 };
TAP.actual = TAP.hits / TAP.songs * 100;          // 2.5
TAP.ratio = TAP.predicted / TAP.actual;           // 20
if (Math.abs(TAP.actual - 2.5) > 1e-9 || Math.abs(TAP.ratio - 20) > 1e-9) throw new Error('实验数字与字幕不一致');

/* ================= 旋律：《生日快乐》前两句（公有领域） ================= */
const BEAT = .42;
const MEL = [ // [拍, 频率, 歌词]
  [0, 392.00, '祝'], [.75, 392.00, '你'], [1, 440.00, '生'], [2, 392.00, '日'], [3, 523.25, '快'], [4, 493.88, '乐'],
  [6, 392.00, '祝'], [6.75, 392.00, '你'], [7, 440.00, '生'], [8, 392.00, '日'], [9, 587.33, '快'], [10, 523.25, '乐'] ];
const TAPLEN = 12 * BEAT;

/* ================= 字幕（先定字幕，再按字幕排画面） ================= */
const SUBS = [
  [0.15, 3.4,  '你说得很清楚，别人却<em>听不懂</em>？'],
  [3.5, 6.6,   '教爸妈用手机，说了三遍，还是<em>找不到</em>；'],
  [6.7, 9.8,   '汇报讲完，老板问：所以你想<em>说什么</em>？'],
  [9.9, 13.0,  '吵架时你喊：我早就<em>说过了</em>啊！'],
  [13.1, 16.6, '这在心理学里，叫<em>「知识的诅咒」</em>。'],
];
const HE = 16.7;                 // 开场结束、标题卡开始
const G0 = HE + 2.8;             // 游戏开始
const KT1 = G0 + 3.4, KT2 = G0 + 15.5, KT3 = G0 + 21.1;   // 三次敲击 / 旋律起点
SUBS.push(
  [G0, G0 + 3.1,          '下面这段敲击，是一首<em>人人会唱</em>的歌。'],
  [G0 + 3.2, KT1 + TAPLEN + .6, '仔细听，猜猜是哪首？'],
  [KT1 + TAPLEN + .7, KT1 + TAPLEN + 3.7, '倒数 3 秒，想好答案。'],
  [KT1 + TAPLEN + 3.8, KT2 - .6, '答案是：<em>《生日快乐》</em>。'],
  [KT2 - .5, KT3 - .5,   '这次带上旋律，再听一遍。'],
  [KT3 - .4, KT3 + TAPLEN + .8, '现在只听敲击，是不是突然觉得<em>很明显</em>？'],
);
const GE = KT3 + TAPLEN + .9;
SUBS.push([GE, GE + 3.2, '敲的人，一直听到的就是<em>这个版本</em>。']);
const NG = SUBS.length;          // 正文第一句的下标
const BODY = [   // [文本, 段首?]
  ['1990年，斯坦福一位心理学研究生做过这个实验。', 1],
  ['一人敲歌，另一人猜歌名。'],
  ['敲之前，先让敲的人估计：对方能猜中几成？'],
  ['他们估计：<em>一半</em>。'],
  [`结果敲了${TAP.songs}首，对方只猜中<red>${TAP.hits}首</red>。`],
  [`实际只有<red>${TAP.actual}%</red>，敲的人高估了整整<em>${TAP.ratio}倍</em>。`],
  ['因为敲的时候，脑子里一直在<em>放旋律</em>；', 1],
  ['听的人，只听到一串<em>咚咚咚</em>。'],
  ['这段旋律，还<em>关不掉</em>。'],
  ['一旦知道答案，就很难再假装不知道。'],
  ['生活里，你也常是那个<em>敲桌子</em>的人。', 1],
  ['你说「点右上角」时，脑子里有整个手机屏幕；'],
  ['爸妈听到的，只有<em>几个字</em>。'],
  ['打字聊天更难，因为连<em>语气</em>都没了。'],
  ['2005年的一组实验发现：发消息的人，'],
  ['普遍以为对方读得懂自己的语气。'],
  ['结果常常是：你在开玩笑，对方<red>当了真</red>。'],
  ['那怎么办？先给一个<em>具体的例子</em>；', 1],
  ['再请对方用<em>自己的话</em>讲一遍。'],
  ['讲不出来，说明旋律还在你脑子里。'],
  ['所以，不是你说不清楚，', 1],
  ['是你忘了：别人没听过那段<em>旋律</em>。'],
  ['你更常是<em>敲的人</em>，还是<em>猜的人</em>？评论区说说。'],
];
{ let t = GE + 3.5;
  BODY.forEach(([txt, sec], i) => { if (i && sec) t += .3; const d = Math.max(2.4, hanLen(txt)/4.9 + .15);
    SUBS.push([+t.toFixed(2), +(t+d).toFixed(2), txt]); t += d + .08; }); }
const S_ = i => SUBS[NG + i][0], E_ = i => SUBS[NG + i][1];   // 正文第 i 句
const END0 = E_(BODY.length - 1) + .3, DURATION = +(END0 + 5.5).toFixed(2);

/* ================= 画布与背景 ================= */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const grain = document.createElement('canvas'); grain.width = 480; grain.height = 270;
{ const gc = grain.getContext('2d'), id = gc.createImageData(480, 270), r = mulberry32(11);
  for (let i = 0; i < id.data.length; i += 4){ const v = 128 + (r() - .5) * 60; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 22; }
  gc.putImageData(id, 0, 0); }
function background(t){
  const gr = g.createRadialGradient(W/2, H*.52, 80, W/2, H*.52, 1150);
  gr.addColorStop(0, '#3b2a1c'); gr.addColorStop(.55, '#24180f'); gr.addColorStop(1, '#100a06');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.drawImage(grain, 0, 0, W, H);
}

/* ================= 绘图部件 ================= */
function rr(x, y, w, h, r){ g.beginPath(); g.roundRect(x, y, w, h, r); }
function shadowOn(b = 22, oy = 10, a = .4){ g.shadowColor = `rgba(8,4,2,${a})`; g.shadowBlur = b; g.shadowOffsetY = oy; }
function shadowOff(){ g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; }
function clayFill(x, y, r, col){   // 黏土感：径向高光
  const gr = g.createRadialGradient(x - r*.35, y - r*.4, r*.1, x, y, r*1.2);
  gr.addColorStop(0, shade(col, 1.25)); gr.addColorStop(1, shade(col, .82)); return gr; }
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); const f = v => clamp(Math.round(v*k), 0, 255);
  return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`; }
function text(s, x, y, o = {}){
  g.font = `${o.w || 700} ${o.size || 40}px ${o.font || SERIF}`; g.fillStyle = o.col || C.cream;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle'; g.fillText(s, x, y); }

/* 人物：o = {body, hair, expr, look, talk, gray, a} */
function person(x, y, s, o = {}){
  const body = o.body || C.olive, look = o.look ?? 0;
  g.save(); g.globalAlpha *= o.a ?? 1;
  g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(x, y + 4*s, 95*s, 16*s, 0, 0, 7); g.fill();
  shadowOn(26*s, 10*s, .35);
  g.fillStyle = clayFill(x, y - 90*s, 110*s, body); rr(x - 78*s, y - 175*s, 156*s, 178*s, [70*s, 70*s, 18*s, 18*s]); g.fill();
  const hx = x + look*6*s, hy = y - 240*s + (o.bob || 0)*s;
  g.fillStyle = clayFill(hx, hy, 66*s, C.skin); g.beginPath(); g.arc(hx, hy, 66*s, 0, 7); g.fill();
  shadowOff();
  // 头发
  g.fillStyle = o.gray ? '#B9B0A4' : (o.hair || '#3a2618');
  g.beginPath(); g.arc(hx, hy - 6*s, 68*s, Math.PI*1.05, Math.PI*1.95); g.quadraticCurveTo(hx, hy - 40*s, hx - 64*s, hy - 22*s); g.fill();
  // 眼睛
  const ex = look*10*s, ey = hy + 2*s, e = o.expr || 'neutral';
  g.fillStyle = '#2a1a10';
  for (const sx of [-1, 1]){ g.beginPath(); g.ellipse(hx + sx*22*s + ex, ey, 6.5*s, (e === 'wide' ? 10 : 8)*s, 0, 0, 7); g.fill(); }
  g.strokeStyle = '#2a1a10'; g.lineWidth = 4.5*s; g.lineCap = 'round';
  if (e === 'confused'){ g.beginPath(); g.moveTo(hx - 32*s + ex, ey - 22*s); g.lineTo(hx - 12*s + ex, ey - 18*s); g.moveTo(hx + 12*s + ex, ey - 26*s); g.lineTo(hx + 32*s + ex, ey - 32*s); g.stroke(); }
  if (e === 'angry'){ g.beginPath(); g.moveTo(hx - 34*s + ex, ey - 24*s); g.lineTo(hx - 12*s + ex, ey - 14*s); g.moveTo(hx + 34*s + ex, ey - 24*s); g.lineTo(hx + 12*s + ex, ey - 14*s); g.stroke(); }
  // 嘴
  const my = hy + 32*s, mx = hx + ex*.8;
  g.beginPath();
  if (o.talk){ const k = .3 + .7*Math.abs(Math.sin(o.talk*13)); g.fillStyle = '#5a2a1c'; g.ellipse(mx, my, 11*s, 9*s*k, 0, 0, 7); g.fill(); }
  else if (e === 'happy'){ g.arc(mx, my - 8*s, 16*s, .2*Math.PI, .8*Math.PI); g.stroke(); }
  else if (e === 'smirk'){ g.moveTo(mx - 14*s, my); g.quadraticCurveTo(mx + 4*s, my + 6*s, mx + 18*s, my - 8*s); g.stroke(); }
  else if (e === 'angry'){ g.arc(mx, my + 12*s, 14*s, 1.2*Math.PI, 1.8*Math.PI); g.stroke(); }
  else if (e === 'confused' || e === 'wide'){ g.fillStyle = '#5a2a1c'; g.ellipse(mx, my, 7*s, 8*s, 0, 0, 7); g.fill(); }
  else { g.moveTo(mx - 12*s, my); g.lineTo(mx + 12*s, my); g.stroke(); }
  if (o.blush){ g.fillStyle = 'rgba(220,90,70,.35)'; for (const sx of [-1,1]){ g.beginPath(); g.ellipse(hx + sx*38*s + ex, ey + 20*s, 12*s, 7*s, 0, 0, 7); g.fill(); } }
  g.restore();
  return { hx, hy, hr: 66*s };
}
/* 气泡：kind = 'say' | 'think' */
function bubble(x, y, w, h, o = {}){
  const k = o.k ?? 1; if (k <= .001) return;
  g.save(); g.globalAlpha *= Math.min(1, k*1.5);
  const ax = o.tail ? o.tail[0] : x, ay = o.tail ? o.tail[1] : y + h/2 + 40;
  g.translate(lerp(ax, x, backOut(k)), lerp(ay, y, backOut(k))); g.scale(backOut(k), backOut(k)); g.translate(-x, -y);
  shadowOn(18, 8, .35); g.fillStyle = o.fill || C.cream;
  rr(x - w/2, y - h/2, w, h, o.kind === 'think' ? h/2 : 26); g.fill();
  if (o.tail){ const [tx, ty] = o.tail;
    if (o.kind === 'think'){ for (const f of [.45, .72]){ const r = lerp(18, 8, f); g.beginPath(); g.arc(lerp(x, tx, f), lerp(y + h/2*Math.sign(ty - y), ty, f), r, 0, 7); g.fill(); } }
    else { const bx = clamp(tx, x - w/2 + 50, x + w/2 - 50), by = ty > y ? y + h/2 - 4 : y - h/2 + 4;
      g.beginPath(); g.moveTo(bx - 22, by); g.lineTo(lerp(bx, tx, .7), lerp(by, ty, .7)); g.lineTo(bx + 22, by); g.fill(); } }
  shadowOff();
  if (o.text){ const lines = o.text.split('\n'), fs = o.size || 46;
    lines.forEach((ln, i) => text(ln, x, y + (i - (lines.length-1)/2)*fs*1.25, {size: fs, w: o.w || 900, col: o.col || C.ink})); }
  if (o.draw) o.draw(x, y);
  g.restore();
}
function note(x, y, s, col, a = 1){   // 八分音符
  g.save(); g.globalAlpha *= a; g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 5*s;
  g.beginPath(); g.ellipse(x, y, 15*s, 11*s, -.4, 0, 7); g.fill();
  g.beginPath(); g.moveTo(x + 13*s, y - 4*s); g.lineTo(x + 13*s, y - 58*s); g.quadraticCurveTo(x + 30*s, y - 40*s, x + 36*s, y - 22*s); g.stroke();
  g.restore();
}
/* 手机 */
function phone(x, y, w, h, title, msgs, t, o = {}){
  g.save(); g.globalAlpha *= o.a ?? 1;
  shadowOn(30, 14, .45); g.fillStyle = '#20160f'; rr(x - w/2, y - h/2, w, h, 46); g.fill(); shadowOff();
  g.fillStyle = '#EDE6D8'; rr(x - w/2 + 16, y - h/2 + 16, w - 32, h - 32, 34); g.fill();
  g.fillStyle = '#D9CFBD'; rr(x - w/2 + 16, y - h/2 + 16, w - 32, 84, [34, 34, 0, 0]); g.fill();
  text(title, x, y - h/2 + 60, {size: 34, w: 700, col: C.ink});
  let yy = y - h/2 + 140;
  for (const m of msgs){
    const k = easeOut(seg(t, m.t, m.t + .3)); if (k <= 0) continue;
    g.font = `700 ${m.size || 38}px ${SERIF}`; const tw = g.measureText(m.text).width, bw = tw + 52, bh = (m.size || 38) + 44;
    const right = m.side === 'r', bx = right ? x + w/2 - 40 - bw : x - w/2 + 40;
    g.save(); g.globalAlpha *= k; g.translate(0, (1 - k)*20);
    g.fillStyle = right ? '#9BC27A' : '#FFFFFF'; rr(bx, yy, bw, bh, 18); g.fill();
    text(m.text, bx + bw/2, yy + bh/2 + 2, {size: m.size || 38, w: 700, col: C.ink});
    if (m.mark){ g.globalAlpha *= seg(t, m.t + .4, m.t + .7); text(m.mark, right ? bx - 18 : bx + bw + 18, yy + bh/2, {size: 30, w: 700, col: m.markCol || '#B5352A', align: right ? 'right' : 'left'}); }
    g.restore();
    yy += bh + 22;
  }
  g.restore();
}
/* 木桌 + 拳头敲击 */
function table(cx, cy, w){
  shadowOn(30, 16, .5);
  g.fillStyle = C.wood; g.beginPath(); g.moveTo(cx - w/2 + 60, cy - 60); g.lineTo(cx + w/2 - 60, cy - 60); g.lineTo(cx + w/2, cy + 60); g.lineTo(cx - w/2, cy + 60); g.closePath(); g.fill();

/* 敲击动画参数：给定起点，返回 [抬手量, 最近一次敲击后的秒数, 第几下] */
function tapState(t, t0){
  let last = -1;
  MEL.forEach(([b], i) => { if (t >= t0 + b*BEAT) last = i; });
  if (last < 0) return [Math.min(1, Math.max(0, (t - t0 + .5)/.4)), 99, -1];
  const dt = t - (t0 + MEL[last][0]*BEAT), nx = MEL[last+1] ? t0 + MEL[last+1][0]*BEAT : 1e9;
  const up = Math.min(seg(dt, .04, .16), 1 - seg(t, nx - .14, nx));
  return [last === MEL.length - 1 ? seg(dt, .1, .5) : up, dt, last];
}
function ripples(x, y, dt, col){
  for (const d of [0, .12]){ const u = seg(dt - d, 0, .6); if (u <= 0 || u >= 1) continue;
    g.strokeStyle = col; g.globalAlpha = (1 - u)*.8; g.lineWidth = 6*(1 - u) + 1;
    g.beginPath(); g.ellipse(x, y, 40 + u*220, 12 + u*60, 0, 0, 7); g.stroke(); g.globalAlpha = 1; }
}

const SECTIONS = [

/* ================= 工具函数 ================= */
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp  = (a,b,t)=>a+(b-a)*t;
const ease  = t => t<.5 ? 2*t*t : 1-((-2*t+2)**2)/2;
const easeOut = t => 1-(1-t)**3;
const seg = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
/* 区间 [a,b] 内可见，淡入 fi 秒、淡出 fo 秒 */
const vis = (t,a,b,fi=.6,fo=.6) => Math.min(ease(seg(t,a,a+fi)), 1-ease(seg(t,b-fo,b)));
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0)/4294967296; }; }
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);

function T(c, s, x, y, font, color, align='center', a=1, spacing=0){
  if (a <= 0.001) return;
  c.save(); c.globalAlpha *= a; c.font = font; c.fillStyle = color;
  c.textAlign = align; c.textBaseline = 'middle';
  if (spacing) c.letterSpacing = spacing + 'px';
  c.fillText(s, x, y); c.restore();
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
/* 纸卡（以当前原点为中心） */
function paper(c, w, h){
  c.save();
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 30; c.shadowOffsetY = 10;
  c.fillStyle = PAPER; roundRect(c, -w/2, -h/2, w, h, 6); c.fill();
  c.shadowColor = 'transparent';
  c.strokeStyle = 'rgba(58,46,32,.12)'; c.lineWidth = 1.5;
  roundRect(c, -w/2+10, -h/2+10, w-20, h-20, 4); c.stroke();
  c.restore();
}
function seal(c, x, y, text, k){
  if (k <= 0) return;
  c.save(); c.translate(x, y); c.rotate(-.12); c.scale(lerp(1.6,1,easeOut(k)), lerp(1.6,1,easeOut(k)));
  c.globalAlpha *= k;
  c.font = `700 28px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(text).width + 26;
  c.strokeStyle = 'rgba(181,58,47,.92)'; c.lineWidth = 3; c.strokeRect(-w/2, -24, w, 48);
  c.fillStyle = 'rgba(181,58,47,.9)'; c.fillText(text, 0, 1);
  c.restore();
}

/* ================= 图元 ================= */
function drawNode(c, x, y, r, label, o={}){
  const a = o.a ?? 1; if (a <= 0.001) return;
  c.save(); c.globalAlpha *= a;
  if (o.glow > 0){
    const gc = o.gc || '201,169,106';
    const g = c.createRadialGradient(x,y,r*.6, x,y,r*2.8);
    g.addColorStop(0, `rgba(${gc},${.5*o.glow})`); g.addColorStop(1, `rgba(${gc},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(x,y,r*2.8,0,Math.PI*2); c.fill();
  }
  c.fillStyle = o.fill || '#14142E'; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  c.lineWidth = o.lw || 2.5; c.strokeStyle = o.stroke || 'rgba(234,234,242,.85)'; c.stroke();
  if (label){
    c.fillStyle = o.lc || INK; c.font = o.font || `700 ${Math.round(r*.62)}px ${SANS}`;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, x, y+1);
  }
  c.restore();
}
function drawBadge(c, x, y, txt, o={}){
  const a = o.a ?? 1; if (a <= 0.001) return;
  c.save(); c.globalAlpha *= a;
  c.font = `700 ${o.size||22}px ${SANS}`;
  const w = Math.max(34, c.measureText(txt).width + 22), h = (o.size||22) + 12;
  c.fillStyle = '#0A0A1E'; roundRect(c, x-w/2, y-h/2, w, h, h/2); c.fill();
  c.strokeStyle = o.col || GOLD; c.lineWidth = 2; c.stroke();
  c.fillStyle = o.col || GOLD; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, x, y+1);
  c.restore();
}
/* 判定标记：ok=金色对勾 / eq=灰色等号 / no=红色叉 */
function drawMark(c, x, y, kind, a){
  if (a <= 0.001) return;
  c.save(); c.globalAlpha *= a; c.lineWidth = 3.5; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();
  if (kind === 'ok'){ c.strokeStyle = GOLD; c.moveTo(x-9,y); c.lineTo(x-3,y+7); c.lineTo(x+10,y-8); }
  else if (kind === 'eq'){ c.strokeStyle = DIM; c.moveTo(x-9,y-4); c.lineTo(x+9,y-4); c.moveTo(x-9,y+5); c.lineTo(x+9,y+5); }
  else { c.strokeStyle = '#D8584A'; c.moveTo(x-8,y-8); c.lineTo(x+8,y+8); c.moveTo(x+8,y-8); c.lineTo(x-8,y+8); }
  c.stroke(); c.restore();
}
function drawEdge(c, p, q, prog, col, a, w){
  if (prog <= 0 || a <= 0.001) return;
  c.save(); c.strokeStyle = `rgba(${col},${a})`; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(lerp(p[0],q[0],prog), lerp(p[1],q[1],prog)); c.stroke();
  c.restore();
}

/* ================= 数据：8 人示意网络 ================= */
const G8 = (()=>{
  const names = ['A','B','C','D','E','F','你','达人'];
  const ang = [200,250,290,340,120,60];
  const pos = ang.map(a=>[960+230*Math.cos(a*Math.PI/180), 400+230*Math.sin(a*Math.PI/180)]);
  pos.push([960,640]); pos.push([960,400]);
  const edges = [[7,0],[7,1],[7,2],[7,3],[7,4],[7,5],[0,1],[2,3],[4,6],[5,6]];
  const nb = names.map(()=>[]); edges.forEach(([a,b])=>{ nb[a].push(b); nb[b].push(a); });
  const deg = nb.map(l=>l.length);
  const favg = nb.map(l=>l.reduce((s,j)=>s+deg[j],0)/l.length);
  const sumD = deg.reduce((a,b)=>a+b,0), sumD2 = deg.reduce((s,d)=>s+d*d,0);
  const mu = sumD/8, fof = sumD2/sumD, sigma2 = sumD2/8 - mu*mu;
  const kind = deg.map((d,i)=> favg[i] > d ? 'ok' : favg[i] === d ? 'eq' : 'no');
  const nPar = kind.filter(k=>k==='ok').length;
  return {names,pos,edges,nb,deg,favg,mu,fof,sigma2,kind,nPar};
})();
/* 字幕里写死的数字必须和计算一致 */
if (G8.mu !== 2.5 || Math.abs(G8.fof-3.2) > 1e-9 || G8.nPar !== 6 || G8.edges.length !== 10)
  throw new Error('G8 数字与字幕不一致');
function gpos(i, tf){ const [x,y] = G8.pos[i]; return [x + Math.sin(tf*.7+i*1.7)*3, y + Math.cos(tf*.6+i*2.1)*3]; }

/* ================= 数据：1000 人优先连接网络 ================= */
const BA = (()=>{
  const r = mulberry32(77), n = 1000, m = 2;
  const edges = [], rep = [];
  [[0,1],[1,2],[0,2]].forEach(([a,b])=>{ edges.push([a,b]); rep.push(a,b); });
  for (let v=3; v<n; v++){
    const tg = new Set();
    while (tg.size < m) tg.add(rep[Math.floor(r()*rep.length)]);
    for (const u of tg){ edges.push([v,u]); rep.push(v,u); }
  }
  const nb = Array.from({length:n}, ()=>[]);
  edges.forEach(([a,b])=>{ nb[a].push(b); nb[b].push(a); });
  const deg = nb.map(l=>l.length);
  const favg = nb.map(l=>l.reduce((s,j)=>s+deg[j],0)/l.length);
  const par = deg.map((d,i)=>favg[i] > d);
  const nPar = par.filter(Boolean).length;
  const sumD = deg.reduce((a,b)=>a+b,0), sumD2 = deg.reduce((s,d)=>s+d*d,0);
  const mu = sumD/n, fof = sumD2/sumD;
  /* Fruchterman–Reingold 布局（固定种子，加载时算一次） */
  const X = new Float64Array(n), Y = new Float64Array(n);
  for (let i=0;i<n;i++){ const a = r()*Math.PI*2, d = Math.sqrt(r()); X[i] = Math.cos(a)*d; Y[i] = Math.sin(a)*d; }
  const k = Math.sqrt(4/n), DX = new Float64Array(n), DY = new Float64Array(n);
  const ITER = 140;
  for (let it=0; it<ITER; it++){
    DX.fill(0); DY.fill(0);
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
      let dx = X[i]-X[j], dy = Y[i]-Y[j], d2 = dx*dx+dy*dy + 1e-6;
      const f = k*k/d2; dx*=f; dy*=f; DX[i]+=dx; DY[i]+=dy; DX[j]-=dx; DY[j]-=dy;
    }
    for (const [a,b] of edges){
      const dx = X[a]-X[b], dy = Y[a]-Y[b], d = Math.sqrt(dx*dx+dy*dy)+1e-9, f = d/k;
      DX[a]-=dx*f; DY[a]-=dy*f; DX[b]+=dx*f; DY[b]+=dy*f;
    }
    const temp = .12*(1-it/ITER)+.003;
    for (let i=0;i<n;i++){
      DX[i] -= X[i]*.6; DY[i] -= Y[i]*.6;           // 向心力，保持紧凑
      const d = Math.sqrt(DX[i]*DX[i]+DY[i]*DY[i])+1e-9, s = Math.min(d,temp)/d;
      X[i] += DX[i]*s; Y[i] += DY[i]*s;
    }
  }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (let i=0;i<n;i++){ x0=Math.min(x0,X[i]); x1=Math.max(x1,X[i]); y0=Math.min(y0,Y[i]); y1=Math.max(y1,Y[i]); }
  const P = Array.from({length:n}, (_,i)=>[960 + ((X[i]-x0)/(x1-x0)-.5)*960, 430 + ((Y[i]-y0)/(y1-y0)-.5)*500]);
  const rank = Array.from({length:n}, ()=>r());
  const rad = deg.map(d=>1.6 + Math.sqrt(d)*1.25);
  /* 落点段：挑 26 个"觉得朋友比自己多"的普通人冒气泡 */
  const bubbles = [];
  for (let i=n-1; i>=0 && bubbles.length<26; i-=37) if (par[i]) bubbles.push(i);
  return {n,edges,deg,favg,par,nPar,mu,fof,P,rank,rad,bubbles};
})();

/* 开场：你 + 6 个朋友（数字为示意） */
const HOOK = (()=>{
  const r = mulberry32(5), F = [128, 86, 203, 154, 97, 176];
  const fr = F.map((v,i)=>{
    const a = (i*60-90)*Math.PI/180, x = 960+Math.cos(a)*250, y = 430+Math.sin(a)*190;
    const n = 7 + Math.round(v/30);
    const dots = Array.from({length:n}, (_,j)=>{
      const aa = a + (r()-.5)*1.5, d = 70 + r()*90;
      return {x: x+Math.cos(aa)*d, y: y+Math.sin(aa)*d*.8, s: r()};
    });
    return {v, x, y, dots};
  });
  return {fr, you: 41};

const CMP0 = 49.2, CMPD = .82;

  const a = vis(t, 45, 75.3, .4, .8); if (a <= 0) return;
  const z1 = ease(seg(t, 56, 57.4)) - ease(seg(t, 59.6, 61.2));

  let hi = -1;
  for (let i=0;i<8;i++) if (t >= CMP0+i*CMPD && t < CMP0+(i+1)*CMPD) hi = i;
  const dimO = i => i === 7 ? 1 : 1 - .62*z1;
  const order = [7,0,1,2,3,4,5,6];

  c.save(); c.globalAlpha = a;
  c.translate(960+ox, 400); c.scale(s, s); c.translate(-960, -400);
  G8.edges.forEach(([u,v],j)=>{
    const p = gpos(u,t), q = gpos(v,t);
    const prog = ease(seg(t, 45.6+j*.12, 46.2+j*.12));
    let col = '234,234,242', ea = .45, w = 2.2;
    if (hi >= 0 && (u === hi || v === hi)){ col = '201,169,106'; ea = .95; w = 3.5; }
    if (u === 7 || v === 7){ ea = lerp(ea, .95, z1); if (z1 > .3) col = '201,169,106'; }
    else ea *= 1 - .62*z1;
    drawEdge(c, p, q, prog, col, ea, w);
  });
  // 被数次数：达人的连线上金色小点流向朋友；其他连线上灰点
  const tok = (u, v, j, col, a0, a1, r0) => {
    const k = vis(t, a0, a1, .4, .4); if (k <= 0) return;
    const ph = ((t - a0)*.9 + j*.17) % 1, p = gpos(u,t), q = gpos(v,t);
    c.fillStyle = `rgba(${col},${.95*k})`;

  };
  G8.edges.forEach(([u,v],j)=>{
    if (u === 7) tok(7, v, j, '201,169,106', 63.4, 71.5, 6);
    else { tok(u, v, j, '234,234,242', 67, 71.5, 4.5); tok(v, u, j+.5, '234,234,242', 67, 71.5, 4.5); }
  });
  for (const i of order){

    // 比较标签
    const lk = ease(seg(t, CMP0+i*CMPD+.3, CMP0+i*CMPD+.7)) * (1 - ease(seg(t, 62.2, 63)));
    if (lk > 0){
      // 上方两人标签放外侧，其余放脚下，避开徽章、连线和顶标签
      const lx = i === 1 ? x - r - 96 : i === 2 ? x + r + 84 : x, ly = (i === 1 || i === 2) ? y : y + r + 28;

      drawMark(c, lx + 70, ly, kind, la);

  // 右侧数据面板（比较阶段）

  // 右侧柱状图（被数次数）
  const ba = a * ease(seg(t, 63.3, 64.2));

      const h = G8.deg[i]*unit*g, x = x0 + j*(bw+gap);
      c.fillStyle = i === 7 ? GOLD : 'rgba(234,234,242,.38)';
      if (h > 0){ roundRect(c, x, base-h, bw, h, 4); c.fill(); }
      T(c, G8.names[i], x+bw/2, base+26, `500 ${i===7?20:22}px ${SANS}`, i === 7 ? GOLD : DIM);
      if (g > .05) T(c, String(Math.round(G8.deg[i]*g)), x+bw/2, base-h-20, `700 24px ${SANS}`, i === 7 ? GOLD : INK, 'center', g);
    });

    if (s2 > 0) T(c, '>', 1410, 690, `700 40px ${SANS}`, DIM, 'center', s2);

/* 1000 人网络 */
function drawBA(c, t, o){
  const {P, edges, rad, par, n} = BA;
  const nk = o.nodeK, gk = o.goldK;
  c.save(); c.globalAlpha *= o.a;
  if (o.cx !== undefined){ c.translate(o.cx, o.cy); c.scale(o.s, o.s); c.translate(-o.cx, -o.cy); }
  if (o.edgesFull){
    c.strokeStyle = 'rgba(234,234,242,.09)'; c.lineWidth = 1; c.beginPath();
    for (const [u,v] of edges){ c.moveTo(P[u][0],P[u][1]); c.lineTo(P[v][0],P[v][1]); }
    c.stroke();
  } else {
    c.lineWidth = 1;
    for (const [u,v] of edges){
      const k = Math.min(nk(u), nk(v)); if (k <= 0) continue;
      c.strokeStyle = `rgba(234,234,242,${.09*k})`;
      c.beginPath(); c.moveTo(P[u][0],P[u][1]); c.lineTo(P[v][0],P[v][1]); c.stroke();
    }
  }
  for (let i=0;i<n;i++){
    const k = nk(i); if (k <= 0) continue;
    const g = par[i] ? gk(i) : 0;
    const r = rad[i] * lerp(.3, 1, k) * (1 + .25*g*(.5+.5*Math.sin(t*2.4+i)));
    c.fillStyle = g > 0
      ? `rgba(${lerp(154,201,g)|0},${lerp(154,169,g)|0},${lerp(184,106,g)|0},${.9*k})`
      : `rgba(154,154,184,${.75*k})`;
    c.beginPath(); c.arc(P[i][0], P[i][1] + Math.sin(t*.9+i)*1.2, r, 0, Math.PI*2); c.fill();
  }
  c.restore();
}
const BA_PCT = BA.nPar / BA.n * 100;
function sceneBA(t){
  const a = vis(t, 83, 91.4, .5, .9); if (a <= 0) return;
  drawBA(c, t, {a,
    edgesFull: t > 86,

  const pk = a * ease(seg(t, 83.6, 84.4));
  let cnt = 0; for (let i=0;i<BA.n;i++) if (BA.par[i] && t >= 86.2+3.2*BA.rank[i]) cnt++;
  c.save(); c.globalAlpha = pk;
  T(c, `${BA.n} 人`, 1690, 250, `700 32px ${SANS}`, INK);

  const sk = ease(seg(t, 89.4, 90));
  T(c, `人均朋友 ${BA.mu.toFixed(1)}`, 1690, 470, `500 22px ${SANS}`, DIM, 'center', sk);

}

  return Array.from({length:N}, (_,i)=>{
    const a = r()*Math.PI*2, d = Math.sqrt(r());
    return {x: 960+Math.cos(a)*d*860, y: 430+Math.sin(a)*d*280, gold: r() < .88, rank: r(), s: r(), tx: 360 + i/N*1200};
  });
})();
function sceneFB(t){
  const a = vis(t, 91, 103.6, .6, 1); if (a <= 0) return;
  const e = ease(seg(t, 91, 93.8)), f = ease(seg(t, 99.6, 102.6));
  c.save(); c.globalAlpha = a;
  for (const p of FB){
    const x0 = lerp(960, p.x, lerp(.04, 1, e)), y0 = lerp(430, p.y, lerp(.04, 1, e));
    const x = lerp(x0 + Math.sin(t*.6+p.s*20)*4, p.tx, f), y = lerp(y0, 600 + Math.sin(p.s*40)*3*(1-f), f);
    const g = p.gold ? ease(seg(t, 95.2+p.rank*2.8, 95.6+p.rank*2.8)) : 0;
    c.fillStyle = g > 0 ? `rgba(201,169,106,${.35+.45*g})` : 'rgba(170,170,200,.45)';
    c.fillRect(x, y, 2.2, 2.2);
  }
  const ck = vis(t, 91.2, 99.4, .5, .6);
  if (ck > 0){
    const v = Math.round(721000000 * easeOut(seg(t, 91.2, 93.8)));
    c.save(); c.shadowColor = 'rgba(5,5,16,.95)'; c.shadowBlur = 30;
    T(c, v.toLocaleString('en-US'), 960, 400, `900 92px ${SANS}`, INK, 'center', ck);
    T(c, '2011 年 5 月 · Facebook 活跃用户', 960, 476, `500 28px ${SANS}`, DIM, 'center', ck);
    T(c, 'Active users, May 2011', 960, 516, `italic 400 24px ${GAR}`, DIM, 'center', ck);
    c.restore();
  }
  c.restore();
}

/* ⑤b 哈佛流感：两组人 → 流行曲线 */
function sceneFlu(t){
  const a = vis(t, 102.6, 115.4, .6, .7); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  // 横轴（承接粒子收拢的那条线）
  c.fillStyle = 'rgba(234,234,242,.6)'; c.fillRect(360, 600, 1200, 2);
  // 两组人
  const ga = vis(t, 103, 107.4, .6, .7);
  if (ga > 0){
    const r = mulberry32(2009);
    const grp = (cx, n, col, k) => { for (let i=0;i<n;i++){ const an = r()*Math.PI*2, d = Math.sqrt(r())*105;
      const kk = clamp(k*n - i*.5, 0, 1); if (kk <= 0) continue;
      c.fillStyle = `rgba(${col},${.85*kk})`; c.beginPath();
      c.arc(cx + Math.cos(an)*d, 400 + Math.sin(an)*d*.8 + Math.sin(t+i)*1.5, 5, 0, Math.PI*2); c.fill(); } };
    c.save(); c.globalAlpha *= ga;
    T(c, '随机抽取的学生', 700, 262, `700 30px ${SANS}`, INK);
    T(c, 'Randomly chosen students', 700, 298, `italic 400 22px ${GAR}`, DIM);
    grp(700, 64, '170,170,200', seg(t, 103.2, 104.4));
    T(c, '319 人', 700, 540, `900 36px ${SANS}`, INK);
    const fk = ease(seg(t, 104.8, 105.6));
    T(c, '他们点名的朋友', 1220, 262, `700 30px ${SANS}`, GOLD, 'center', fk);
    T(c, 'The friends they named', 1220, 298, `italic 400 22px ${GAR}`, DIM, 'center', fk);
    grp(1220, 85, '201,169,106', seg(t, 104.8, 106));
    T(c, '425 人', 1220, 540, `900 36px ${SANS}`, GOLD, 'center', fk);
    const ar = ease(seg(t, 104.2, 105.2));
    if (ar > 0){
      c.strokeStyle = 'rgba(234,234,242,.6)'; c.lineWidth = 2.5; c.beginPath();
      c.moveTo(850, 400); c.lineTo(lerp(850, 1060, ar), 400); c.stroke();
      if (ar > .95){ c.beginPath(); c.moveTo(1048, 390); c.lineTo(1062, 400); c.lineTo(1048, 410); c.stroke(); }
      T(c, '点名', 955, 376, `500 22px ${SANS}`, DIM, 'center', ar);
    }
    c.restore();
  }
  // 流行曲线（示意）
  const ca = ease(seg(t, 106.8, 107.6));
  if (ca > 0){
    c.save(); c.globalAlpha *= ca;
    c.fillStyle = 'rgba(234,234,242,.6)'; c.fillRect(360, 270, 2, 330);
    T(c, '累计确诊（示意）', 372, 252, `500 22px ${SANS}`, DIM, 'left');
    T(c, '9 月', 360, 632, `500 22px ${SANS}`, DIM);
    T(c, '12 月', 1560, 632, `500 22px ${SANS}`, DIM);
    T(c, '2009 年秋季学期 · Fall 2009', 960, 632, `italic 400 22px ${GAR}`, DIM);
    const xm = lerp(360, 1560, ease(seg(t, 107.2, 110.4)));
    const curve = (x0, col, w) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath();
      for (let x=360; x<=xm; x+=4){ const y = 600 - 300/(1+Math.exp(-(x-x0)/45)); x === 360 ? c.moveTo(x,y) : c.lineTo(x,y); }
      c.stroke(); };
    const glow = .5 + .5*Math.sin(t*3);
    curve(1100, 'rgba(170,170,200,.85)', 3);
    c.save(); c.shadowColor = 'rgba(201,169,106,.8)'; c.shadowBlur = 10 + 14*glow*seg(t, 111, 112);
    curve(962, GOLD, 4); c.restore();
    const lk = ease(seg(t, 109.4, 110.2));
    if (lk > 0){
      c.save(); c.globalAlpha *= lk; c.strokeStyle = INK; c.lineWidth = 2;
      c.beginPath(); c.moveTo(972, 450); c.lineTo(1090, 450);
      c.moveTo(982, 442); c.lineTo(972, 450); c.lineTo(982, 458);
      c.moveTo(1080, 442); c.lineTo(1090, 450); c.lineTo(1080, 458); c.stroke();
      c.restore();
      T(c, '约早两周', 1112, 436, `700 28px ${SANS}`, GOLD, 'left', lk);
      T(c, '~2 weeks earlier', 1114, 472, `italic 400 22px ${GAR}`, DIM, 'left', lk);
      T(c, '被点名的朋友', 925, 330, `700 24px ${SANS}`, GOLD, 'right', lk);
      T(c, '随机学生', 1160, 548, `700 24px ${SANS}`, 'rgba(170,170,200,.95)', 'left', lk);
    }
    c.restore();
  }
  c.restore();
}

/* ⑤c 熟人免疫：随机挑人 → 沿连线找到他的朋友 */
function sceneAcq(t){
  const a = vis(t, 115, 119.4, .6, .7); if (a <= 0) return;
  c.save(); c.globalAlpha = a;
  c.translate(960, 420); c.scale(.92, .92); c.translate(-960, -400);
  const step2 = ease(seg(t, 116.5, 117.5)), step3 = ease(seg(t, 117.4, 118));
  G8.edges.forEach(([u,v])=>{
    const hot = (u === 7 && v === 4);
    drawEdge(c, gpos(u,t), gpos(v,t), 1, hot && step2 > 0 ? '201,169,106' : '234,234,242', hot ? lerp(.45,.95,step2) : .4, hot ? 3.5 : 2.2);
  });
  if (step2 > 0 && step2 < 1){
    const p = gpos(4,t), q = gpos(7,t);
    c.fillStyle = GOLD; c.beginPath(); c.arc(lerp(p[0],q[0],step2), lerp(p[1],q[1],step2), 8, 0, Math.PI*2); c.fill();
  }
  for (let i=0;i<8;i++){
    const [x,y] = gpos(i,t), r = i === 7 ? 44*(1+.15*step3) : 34;
    const pick = ease(seg(t, 115.4, 116.2));
    const ring = i === 4 ? pick : 0;
    drawNode(c, x, y, r, G8.names[i], {glow: i === 7 ? step3 : ring*.8, stroke: i === 4 && pick > .5 ? INK : i === 7 && step3 > .3 ? GOLD : 'rgba(234,234,242,.7)',
      font: i === 7 ? `700 25px ${SANS}` : undefined, fill: i === 6 ? '#1E1E40' : undefined});
    drawBadge(c, x + r*.82, y - r*.95, String(G8.deg[i]), {a: .9});
    if (i === 4 && ring > 0){
      c.save(); c.globalAlpha *= ring; c.strokeStyle = INK; c.setLineDash([6,6]); c.lineWidth = 2;
      c.beginPath(); c.arc(x, y, r+14 + 3*Math.sin(t*4), 0, Math.PI*2); c.stroke(); c.restore();
      T(c, '随机挑一个人', x-70, y, `700 26px ${SANS}`, INK, 'right', ring);
    }
  }
  T(c, '他的朋友，往往就是枢纽', 960, 482, `700 26px ${SANS}`, GOLD, 'center', step3);
  c.restore();
}

/* ⑥ 落点：回到"你"，拉远成千人网络 */
function sceneOutro(t){
  const a = vis(t, 119, 131.3, .7, .9); if (a <= 0) return;
  const z = ease(seg(t, 123, 126.4));
  if (z < 1){
    const s = lerp(1, .2, z);
    c.save(); c.globalAlpha = a * (1 - ease(seg(t, 125.4, 126.6)));
    c.translate(960, 420); c.scale(s, s); c.translate(-960, -420);
    drawHook(c, 9, t);
    c.restore();
  }
  if (z > 0){
    drawBA(c, t, {a: a*z, edgesFull: true, cx: 960, cy: 430, s: lerp(2.4, 1, z),
      nodeK: () => 1, goldK: () => 1});
    // 气泡：每个普通人都觉得"朋友比我多"
    BA.bubbles.forEach((i,j)=>{
      const k = ease(seg(t, 127+j*.1, 127.5+j*.1)) * a; if (k <= 0) return;
      const [x,y] = BA.P[i], bx = x + 10, by = y - 26 + Math.sin(t*2+j)*2;
      c.save(); c.globalAlpha = k;
      c.fillStyle = 'rgba(234,234,242,.92)'; roundRect(c, bx-4, by-14, 36, 24, 10); c.fill();
      c.beginPath(); c.moveTo(bx+2, by+8); c.lineTo(bx-4, by+16); c.lineTo(bx+10, by+9); c.fill();
      c.fillStyle = '#14142E'; c.beginPath();
      for (let d=0; d<3; d++) c.arc(bx+5+d*9, by-2, 2.2, 0, Math.PI*2);
      c.fill(); c.restore();
    });
  }
}

/* ⑦ 收尾：声明 → 出品 + 引用 */
function sceneEnd(t){
  const a1 = vis(t, 131.2, 135.2, .7, .6);
  if (a1 > 0){
    T(c, '声明', 960, 330, `900 40px ${SERIF}`, GOLD, 'center', a1, 8);
    T(c, '本片网络图为示意模型，不代表任何真实社交关系。', 960, 410, `500 32px ${SANS}`, INK, 'center', a1);
    T(c, 'The networks shown are illustrative models, not real social data.', 960, 458, `italic 400 26px ${GAR}`, DIM, 'center', a1);
    T(c, '觉得朋友比你多？绝大多数人都这么觉得。', 960, 540, `500 28px ${SANS}`, DIM, 'center', a1 * ease(seg(t, 132.2, 133)));
  }
  const a2 = ease(seg(t, 135.2, 136));
  if (a2 > 0){
    T(c, '@Leo 出品', 960, 268, `900 60px ${SERIF}`, GOLD, 'center', a2, 4);
    T(c, '参考 · References', 960, 360, `500 22px ${SANS}`, DIM, 'center', a2, 4);
    const refs = [
      'S. L. Feld, "Why Your Friends Have More Friends Than You Do," American Journal of Sociology 96(6), 1991',
      'N. A. Christakis & J. H. Fowler, "Social Network Sensors for Early Detection of Contagious Outbreaks," PLoS ONE, 2010',
      'J. Ugander, B. Karrer, L. Backstrom & C. Marlow, "The Anatomy of the Facebook Social Graph," arXiv:1111.4503, 2011',
      'R. Cohen, S. Havlin & D. ben-Avraham, "Efficient Immunization Strategies…," Phys. Rev. Lett. 91, 247901, 2003',
    ];
    refs.forEach((s,i)=> T(c, s, 960, 412 + i*44, `italic 400 25px ${GAR}`, 'rgba(234,234,242,.78)', 'center', ease(seg(t, 135.6+i*.25, 136.2+i*.25))));
    // 角落：一个缓慢呼吸的小点"你"
    const pk = ease(seg(t, 136.6, 137.4));
    drawNode(c, 960, 660, 16 + Math.sin(t*2)*1.5, '', {a: pk, glow: .8 + .2*Math.sin(t*2)});
  }
}

function drawScene(t){
  c.clearRect(0,0,1920,1080);
  sceneHook(t); sceneDocs(t); sceneRules(t); sceneNet(t); sceneFormula(t);
  sceneBA(t); sceneFB(t); sceneFlu(t); sceneAcq(t); sceneOutro(t); sceneEnd(t);
}

/* ================= 覆盖层 ================= */
const $ = id => document.getElementById(id);
function drawOverlay(t){
  const inTitle = t >= TITLE_CARD[0] && t < TITLE_CARD[1];
  const sub = SUBTITLES.find(([a,b]) => t >= a && t < b);
  const el = $('subtitle'), elEn = $('subtitle-en');
  if (sub && !inTitle) {
    const [a, b, zh, en] = sub;
    const kIn  = ease(clamp((t-a)/0.45, 0, 1));
    const kOut = 1 - ease(clamp((t-(b-0.4))/0.4, 0, 1));
    el.style.opacity = kIn * kOut;
    el.style.transform = `translateY(${lerp(8,0,kIn)}px)`;
    if (el.innerHTML !== zh) el.innerHTML = zh;
    elEn.textContent = en || '';
    elEn.style.opacity = kIn * kOut * .9;
  } else { el.innerHTML = ''; elEn.textContent = ''; }
  const tc = $('titlecard');
  if (inTitle) {
    tc.style.display = 'flex';
    const k = ease(clamp((t-TITLE_CARD[0])/1.2, 0, 1)) * (1 - ease(seg(t, TITLE_CARD[1]-.7, TITLE_CARD[1])));
    tc.style.opacity = k;
    tc.querySelector('.name').textContent = TITLE_CARD[2];
    tc.querySelector('.q').textContent = TITLE_CARD[3];
    tc.querySelector('.q-en').textContent = TITLE_CARD[4];
    tc.querySelector('.name').style.transform = `scale(${lerp(.94, 1, easeOut(seg(t, TITLE_CARD[0], TITLE_CARD[1])))})`;
  } else tc.style.display = 'none';
  let sec = SECTIONS[0];
  for (const s of SECTIONS) if (t >= s[0]) sec = s;
  $('toplabel').textContent = sec[1] ? `${CFG.topic}　${sec[1]}` : CFG.topic;
  $('annotation').textContent = sec[2] || '';
}

/* ================= 帧入口 ================= */
window.render = function(t){ drawBG(t); drawScene(t); drawOverlay(t); };
/* 渲染管线的异步初始化：把脚本里出现的所有字形都预加载，防止中途换字体 */
window.setup = function(done){
  const text = document.querySelector('script').textContent + document.body.innerText;
  const faces = [`400 20px "Noto Sans SC"`, `500 20px "Noto Sans SC"`, `600 20px "Noto Sans SC"`, `700 20px "Noto Sans SC"`, `900 20px "Noto Sans SC"`,
    `600 20px "Noto Serif SC"`, `900 20px "Noto Serif SC"`,
    `400 20px "EB Garamond"`, `500 20px "EB Garamond"`, `600 20px "EB Garamond"`, `italic 400 20px "EB Garamond"`, `italic 500 20px "EB Garamond"`];
  Promise.all(faces.map(f => document.fonts.load(f, text).catch(()=>null)))
    .then(() => document.fonts.ready).then(() => done && done());
};
window.STATS = { g8: {mu: G8.mu, fof: G8.fof, nPar: G8.nPar}, ba: {pct: BA_PCT, mu: BA.mu, fof: BA.fof, maxDeg: Math.max(...BA.deg)} };
let t0 = performance.now();
(function loop(){
  if (window.__RENDER_MODE__) return;
  window.render(((performance.now()-t0)/1000) % CFG.duration);
  requestAnimationFrame(loop);
})();
</script>

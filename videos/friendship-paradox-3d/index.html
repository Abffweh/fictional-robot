<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!--
  《你的朋友，比你受欢迎》v3 · 3D 黏土微缩风 · @Leo
  - three.js（vendor/three.min.js，MIT）实时渲染；window.render(t) 纯时间函数，逐帧截图
  - 无背景音乐：音效时间表见 window.SFX_CUES，由 sfx.py 合成
  - 片中统计数字全部由代码现场计算
-->
<title>你的朋友，比你受欢迎 · 3D</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@500;700&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1a120c; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .ui { position: absolute; z-index: 20; font-family: 'Noto Serif SC', serif; color: #F3E8CF;
        text-shadow: 0 2px 10px rgba(20,10,4,.85), 0 0 2px rgba(20,10,4,.9); }
  #watermark { top: 1028px; left: 56px; font: 500 24px 'Noto Sans SC'; color: rgba(243,232,207,.55); }
  #check { top: 74px; left: 70px; }
  #check .head { font: 500 30px 'Noto Serif SC'; letter-spacing: 6px; }
  #check .head i { font: italic 500 34px 'EB Garamond', serif; letter-spacing: 1px; margin-left: 10px; }
  #check .row { display: flex; align-items: center; gap: 14px; margin-top: 14px; font: 700 40px 'Noto Serif SC'; }
  #check .box { width: 34px; height: 34px; border: 3px solid #F3E8CF; border-radius: 3px; position: relative; flex: none; }
  #check .box.on::after { content: ''; position: absolute; left: 8px; top: -6px; width: 12px; height: 26px;
        border: solid #E7C98B; border-width: 0 5px 5px 0; transform: rotate(40deg); }
  #check .box.x { border-color: #D8584A; }
  #check .box.x::before, #check .box.x::after { content: ''; position: absolute; left: 13px; top: -2px; width: 3px; height: 32px; background: #D8584A; }
  #check .box.x::before { transform: rotate(45deg); } #check .box.x::after { transform: rotate(-45deg); }
  #corner { top: 150px; right: 80px; text-align: right; }
  #corner .a { font: italic 500 54px 'EB Garamond', serif; }
  #corner .a::after { content: ''; display: block; height: 3px; width: 140px; margin: 6px 0 0 auto; background: #C8463A; }
  #corner .b { font: 500 36px 'Noto Serif SC'; letter-spacing: 6px; margin-top: 12px; }
  #subtitle { left: 0; right: 0; top: 960px; text-align: center; font: 900 66px 'Noto Serif SC'; letter-spacing: 3px; }
  #subtitle .ch { display: inline-block; }
  #subtitle .em { color: #F0C987; }
  #subtitle .red { color: #E8735F; text-decoration: underline; text-underline-offset: 10px; text-decoration-thickness: 3px; }
  #labels { position: absolute; inset: 0; z-index: 15; pointer-events: none; }
  .lab { position: absolute; font: 700 44px 'Noto Serif SC'; color: #F3E8CF; text-shadow: 0 2px 10px rgba(20,10,4,.9);
         transform: translate(-50%, -100%); white-space: nowrap; }
  .lab.small { font-size: 30px; }
  .lab.gold { color: #F0C987; }
  #title { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  #title .s { font: 500 26px 'Noto Sans SC'; letter-spacing: 16px; color: rgba(240,201,135,.85); }
  #title .n { font: 900 112px 'Noto Serif SC'; color: #F0C987; letter-spacing: 6px; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  #title .q { font: 500 40px 'Noto Serif SC'; color: #F3E8CF; }
  #title .ch { display: inline-block; }
  #check .row.cur::before { content: '-'; position: absolute; margin-left: -26px; }
  #check .row { position: relative; }
  .lab::after { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: 30px; background: rgba(243,232,207,.75); }
  .lab { margin-top: -30px; }
  #title .refs { font: italic 500 30px 'EB Garamond', serif; color: rgba(243,232,207,.85); text-align: center; line-height: 1.7; margin-top: 18px; }
  #title .note { font: 500 26px 'Noto Serif SC'; color: rgba(243,232,207,.6); margin-top: 18px; }
  #hook { position: absolute; left: 0; right: 0; z-index: 25; text-align: center; font-family: 'Noto Serif SC', serif; color: #F6ECD6; pointer-events: none;
           text-shadow: 0 3px 14px rgba(15,8,3,.95), 0 0 3px rgba(15,8,3,.95); }
  #hook .t { display: inline-block; font-weight: 900; letter-spacing: 4px; }
  #hook .hc { display: inline-block; }
  #hook .g { color: #F0C987; } #hook .r { color: #EE7A62; }
  #hook .u { height: 5px; margin: 10px auto 0; background: linear-gradient(90deg, rgba(240,201,135,0), #F0C987 20%, #F0C987 80%, rgba(240,201,135,0)); }
  #hookbg { position: absolute; left: 0; right: 0; top: 0; height: 240px; z-index: 24; pointer-events: none;
           background: linear-gradient(180deg, rgba(20,11,5,.62), rgba(20,11,5,0)); }
</style>

<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="labels"></div>
  <div id="hookbg"></div>
  <div id="hook"><div class="t"><span class="hc ">你</span><span class="hc ">的</span><span class="hc ">朋</span><span class="hc ">友</span><span class="hc ">比</span><span class="hc ">你</span><span class="hc g">更</span><span class="hc g">受</span><span class="hc g">欢</span><span class="hc g">迎</span><span class="hc r">？</span></div><div class="u"></div></div>
  <div id="check" class="ui"></div>
  <div id="corner" class="ui"><div class="a"></div><div class="b"></div></div>
  <div id="subtitle" class="ui"></div>
  <div id="watermark" class="ui">@Leo</div>
  <div id="title"><div class="s">VIBE知识大赏</div><div class="n"></div><div class="q"></div></div>
</div>
<script src="vendor/three.min.js"></script>
<script>
'use strict';
/* ================= 工具 ================= */
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const lerp = (a,b,t)=>a+(b-a)*t;
const ease = t => t<.5 ? 2*t*t : 1-((-2*t+2)**2)/2;
const easeOut = t => 1-(1-t)**3;
const seg = (t,a,b) => clamp((t-a)/(b-a),0,1);
const vis = (t,a,b,fi=.4,fo=.4) => Math.min(ease(seg(t,a,a+fi)), 1-ease(seg(t,b-fo,b)));
function mulberry32(seed){ return function(){ let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14)>>>0)/4294967296; }; }
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const SERIF = "'Noto Serif SC', serif", SANS = "'Noto Sans SC', sans-serif", GAR = "'EB Garamond', serif";
const COL = { cream:'#EFE4CF', olive:'#7D8A4E', moss:'#97A06A', brown:'#7A5235', rust:'#A9532E', you:'#D9772E',
  mauve:'#8A5F6B', mustard:'#C9A248', sage:'#6F7D6A', clay:'#B98A64', wood:'#5A3A22', gold:'#E0B66A' };
const PAWN_COLORS = [COL.olive, COL.brown, COL.mauve, COL.mustard, COL.sage, COL.rust, COL.moss, COL.clay];

/* ================= 渲染器 ================= */
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('gl'), antialias: false, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1c12');
scene.fog = new THREE.Fog('#2a1c12', 40, 120);
const camera = new THREE.PerspectiveCamera(32, W/H, .1, 400);

const hemi = new THREE.HemisphereLight('#ffe2bd', '#3b2414', .9); scene.add(hemi);
const key = new THREE.DirectionalLight('#ffd6a0', 2.6);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -16; key.shadow.camera.right = 16; key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
key.shadow.camera.near = 1; key.shadow.camera.far = 80; key.shadow.bias = -.0006; key.shadow.normalBias = .02; key.shadow.radius = 4;
scene.add(key); scene.add(key.target);
const fill = new THREE.DirectionalLight('#9fb4ff', .35); fill.position.set(-20, 12, -10); scene.add(fill);

/* 后期：场景 → 移轴模糊（横 / 竖）→ 调色、暗角、颗粒 */
const rtOpts = {type: THREE.HalfFloatType, samples: 4};
const rtA = new THREE.WebGLRenderTarget(W, H, rtOpts), rtB = new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType}), rtC = new THREE.WebGLRenderTarget(W, H, {type: THREE.HalfFloatType});
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2)); const postScene = new THREE.Scene(); postScene.add(quad);
const blurMat = new THREE.ShaderMaterial({
  uniforms: {tex:{value:null}, dir:{value:new THREE.Vector2(1,0)}, focus:{value:.5}, band:{value:.16}, amount:{value:6}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }',
  fragmentShader: `uniform sampler2D tex; uniform vec2 dir; uniform float focus, band, amount; varying vec2 vUv;
    void main(){ float d = max(0., abs(vUv.y - focus) - band); float r = amount * smoothstep(0., .35, d);
      vec2 px = dir / vec2(${W}., ${H}.) * r; vec4 c = vec4(0.); float ws = 0.;
      for (int i=-6; i<=6; i++){ float w = exp(-float(i*i)/18.); c += texture2D(tex, vUv + px*float(i)) * w; ws += w; }
      gl_FragColor = c / ws; }`, depthTest: false });
const gradeMat = new THREE.ShaderMaterial({
  uniforms: {tex:{value:null}, time:{value:0}, fade:{value:1}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }',
  fragmentShader: `uniform sampler2D tex; uniform float time, fade; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time*37.1) * 43758.5453); }
    void main(){ vec3 c = texture2D(tex, vUv).rgb;
      c = c / (c + vec3(.82)) * 1.82;                      // 柔和高光
      c = pow(c, vec3(1./2.2));
      c *= vec3(1.06, .99, .88);                           // 暖调
      c = mix(vec3(dot(c, vec3(.299,.587,.114))), c, .88);
      float v = smoothstep(1.15, .35, length((vUv-.5)*vec2(1.25,1.)));
      c *= mix(.45, 1., v);
      c += (h(vUv*vec2(${W}.,${H}.)) - .5) * .045;
      gl_FragColor = vec4(c * fade, 1.); }`, depthTest: false });
renderer.toneMapping = THREE.NoToneMapping;   // 色调交给 gradeMat
function post(focus, band, amount, t, fade){
  renderer.setRenderTarget(rtA); renderer.render(scene, camera);
  quad.material = blurMat; blurMat.uniforms.focus.value = focus; blurMat.uniforms.band.value = band; blurMat.uniforms.amount.value = amount;
  blurMat.uniforms.tex.value = rtA.texture; blurMat.uniforms.dir.value.set(1,0); renderer.setRenderTarget(rtB); renderer.render(postScene, postCam);
  blurMat.uniforms.tex.value = rtB.texture; blurMat.uniforms.dir.value.set(0,1); renderer.setRenderTarget(rtC); renderer.render(postScene, postCam);
  quad.material = gradeMat; gradeMat.uniforms.tex.value = rtC.texture; gradeMat.uniforms.time.value = t; gradeMat.uniforms.fade.value = fade;
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

/* ================= 材质与贴图 ================= */
const matCache = {};
function clay(color, opts={}){
  const k = color + JSON.stringify(opts);
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial({color, roughness: opts.r ?? .88, metalness: 0,
    emissive: opts.emissive || '#000000', emissiveIntensity: opts.ei ?? 1, transparent: !!opts.transparent, opacity: opts.opacity ?? 1});
  return matCache[k];
}
const TEXDRAW = [];   // 字体就绪后要重画的画布贴图
function canvasTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const job = () => { const g = cv.getContext('2d'); g.clearRect(0,0,w,h); draw(g, w, h); tex.needsUpdate = true; };
  job(); TEXDRAW.push(job); return tex;
}
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
/* 木纹 / 地砖 */
const woodTex = canvasTex(1024, 1024, (g,w,h)=>{
  g.fillStyle = '#5b3a23'; g.fillRect(0,0,w,h); const r = mulberry32(3);
  for (let i=0;i<260;i++){ g.strokeStyle = `rgba(${30+r()*40|0},${18+r()*20|0},${8+r()*10|0},${.15+r()*.25})`; g.lineWidth = 1+r()*4;
    g.beginPath(); const y = r()*h; g.moveTo(0,y); for (let x=0;x<=w;x+=64) g.lineTo(x, y+Math.sin(x*.01+i)*6); g.stroke(); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(15, 6);
const tileTex = canvasTex(512, 512, (g,w,h)=>{
  g.fillStyle = '#b08a64'; g.fillRect(0,0,w,h); const r = mulberry32(9), n = 4, s = w/n;
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){ g.fillStyle = `hsl(${28+r()*6},${30+r()*8}%,${46+r()*8}%)`; g.fillRect(i*s+3,j*s+3,s-6,s-6); }
  for (let k=0;k<900;k++){ g.fillStyle = `rgba(60,36,20,${r()*.5})`; g.fillRect(r()*w, r()*h, 2+r()*3, 2+r()*3); }
});
tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;

/* ================= 道具 ================= */
const pawnBodyGeo = new THREE.LatheGeometry([V3(0,0,0),V3(.46,0,0),V3(.5,.08,0),V3(.44,.6,0),V3(.34,1.0,0),V3(.22,1.18,0),V3(0,1.2,0)].map(v=>new THREE.Vector2(v.x,v.y)), 28);
const headGeo = new THREE.SphereGeometry(.36, 28, 20), eyeGeo = new THREE.SphereGeometry(.045, 10, 8);
function pawn(color, o={}){
  const g = new THREE.Group();
  const body = new THREE.Mesh(pawnBodyGeo, clay(color)); body.castShadow = body.receiveShadow = true; g.add(body);
  const head = new THREE.Mesh(headGeo, clay(COL.cream, {r:.7})); head.position.y = 1.5; head.castShadow = true; g.add(head);
  for (const s of [-1,1]){ const e = new THREE.Mesh(eyeGeo, clay('#1b120c', {r:.3})); e.position.set(s*.12, 1.53, .33); g.add(e); }
  if (o.scarf){ const sc = new THREE.Mesh(new THREE.TorusGeometry(.25,.09,10,24), clay(COL.mustard)); sc.rotation.x = Math.PI/2; sc.position.y = 1.18; sc.castShadow = true; g.add(sc); }
  if (o.hat){ const h1 = new THREE.Mesh(new THREE.CylinderGeometry(.3,.36,.18,20), clay(o.hat)); h1.position.y = 1.82; h1.castShadow = true; g.add(h1);
    const h2 = new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.04,24), clay(o.hat)); h2.position.y = 1.74; g.add(h2); }
  g.userData.head = head; g.scale.setScalar(o.s || 1);
  return g;
}
function face(o, x, z){ o.rotation.set(0, Math.atan2(x - o.position.x, z - o.position.z), 0); }
function box(w,h,d,color,o={}){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), o.mat || clay(color,o)); m.castShadow = o.cast ?? true; m.receiveShadow = true; return m; }
function cyl(rt,rb,h,color,o={}){ const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||28), o.mat || clay(color,o)); m.castShadow = o.cast ?? true; m.receiveShadow = true; return m; }
function base(w, d){   // 微缩台座
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(w,.5,d), [clay('#6b4a30'),clay('#6b4a30'),new THREE.MeshStandardMaterial({map: tileTex.clone(), roughness:.9}),clay('#6b4a30'),clay('#5e4029'),clay('#5e4029')]);
  top.material[2].map.repeat.set(w/2.5, d/2.5); top.material[2].map.needsUpdate = true;
  top.position.y = -.25; top.receiveShadow = true; top.castShadow = true; g.add(top);
  return g;
}
/* 永远面向镜头的贴图牌（气泡、+1、爱心…） */
function sprite(tex, w, h){ const s = new THREE.Sprite(new THREE.SpriteMaterial({map: tex, transparent: true, depthWrite: false})); s.scale.set(w, h, 1); return s; }
function bubbleTex(text, o={}){
  return canvasTex(512, 256, (g,w,h)=>{
    g.fillStyle = o.bg || '#F3E8CF'; rr(g, 16, 16, w-32, h-70, 60); g.fill();
    g.beginPath(); g.moveTo(o.right ? w-150 : 120, h-56); g.lineTo(o.right ? w-110 : 90, h-8); g.lineTo(o.right ? w-200 : 180, h-56); g.fill();
    g.fillStyle = o.fg || '#3A2614'; g.font = `700 ${o.size||84}px ${SERIF}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w/2, (h-54)/2+8);
  });
}

/* ================= 世界 ================= */
const table = new THREE.Mesh(new THREE.PlaneGeometry(1000, 400), new THREE.MeshStandardMaterial({map: woodTex, roughness: .75, color: '#8a6446'}));
table.rotation.x = -Math.PI/2; table.position.x = 150; table.receiveShadow = true; scene.add(table);

const SETS = {};   // name → {group, update(t), center}

/* ---------- 场景 A：朋友圈（你独自刷手机 | 隔壁在聚会） ---------- */
SETS.feed = (()=>{
  const g = new THREE.Group(); g.position.set(0, 0, 0);
  const b = base(14, 8); b.position.y = .5; g.add(b);
  const Y = .5;  // 台面高度
  // 隔墙
  const wall = box(.3, 2.6, 8, '#cdb08a'); wall.position.set(0, Y+1.3, 0); g.add(wall);
  const back = box(14, 3.2, .3, '#c2a07a'); back.position.set(0, Y+1.6, -3.85); g.add(back);
  // 左：你的房间（沙发 + 落地灯 + 手机）
  const sofa = new THREE.Group();
  const s1 = box(3.6, .7, 1.4, '#6d5a7a'); s1.position.y = .35; sofa.add(s1);
  const s2 = box(3.6, 1.2, .4, '#665373'); s2.position.set(0, .9, -.55); sofa.add(s2);
  for (const sx of [-1.9, 1.9]){ const a = box(.35, 1.0, 1.4, '#665373'); a.position.set(sx, .5, 0); sofa.add(a); }
  sofa.position.set(-3.6, Y, -1.6); g.add(sofa);
  const you = pawn(COL.you, {scarf: true}); you.position.set(-3.6, Y+.7, -1.4); g.add(you);
  const phone = box(.5, .9, .06, '#1a1410'); phone.position.set(-3.25, Y+.7+1.05, -.95); phone.rotation.set(-.5, -.25, 0); g.add(phone);
  const glow = new THREE.PointLight('#9fc8ff', 3, 4, 2); glow.position.set(-3.2, Y+2.0, -.6); g.add(glow);
  const lamp = cyl(.05, .05, 2.6, '#2d2219'); lamp.position.set(-6.2, Y+1.3, -2.8); g.add(lamp);
  const shade = cyl(.35, .6, .6, '#e9d3a6', {emissive:'#ffcf8a', ei:.25}); shade.position.set(-6.2, Y+2.7, -2.8); g.add(shade);
  const plant = cyl(.3, .25, .5, '#7a4b2e'); plant.position.set(-1.2, Y+.25, 2.4); g.add(plant);
  const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(.55, 1), clay(COL.moss)); leaves.position.set(-1.2, Y+.95, 2.4); leaves.castShadow = true; g.add(leaves);
  // 右：聚会（圆桌 + 6 人 + 彩灯）
  const tb = cyl(1.7, 1.7, .18, '#e9dcc0'); tb.position.set(3.6, Y+1.0, -.3); g.add(tb);
  const leg = cyl(.15, .3, 1.0, '#5a3a22'); leg.position.set(3.6, Y+.5, -.3); g.add(leg);
  const guests = [];
  for (let i=0;i<6;i++){
    const a = i/6*Math.PI*2 + .3, p = pawn(PAWN_COLORS[i], {hat: i===2 ? '#C8463A' : undefined});
    p.position.set(3.6 + Math.cos(a)*2.3, Y, -.3 + Math.sin(a)*2.3); face(p, 3.6, -.3); g.add(p); guests.push(p);
  }
  const food = [];
  for (let i=0;i<7;i++){ const a = i/7*Math.PI*2, f = cyl(.25, .25, .12, ['#c9a248','#a9532e','#97a06a','#efe4cf'][i%4]);
    f.position.set(3.6 + Math.cos(a)*1.0, Y+1.15, -.3 + Math.sin(a)*1.0); g.add(f); food.push(f); }
  const cake = cyl(.45, .45, .4, '#f0d9c6'); cake.position.set(3.6, Y+1.3, -.3); g.add(cake);
  const bulbs = [];

const G8 = (()=>{

  const deg = nb.map(l=>l.length);
  const favg = nb.map(l=>l.reduce((s,j)=>s+deg[j],0)/l.length);
  const sumD = deg.reduce((a,b)=>a+b,0), sumD2 = deg.reduce((s,d)=>s+d*d,0);

  return {names,pos,edges,nb,deg,favg,mu,fof,sigma2,kind,nPar: kind.filter(k=>k==='ok').length};
})();

const BA = (()=>{
  const r = mulberry32(77), n = 1000, m = 2, edges = [], rep = [];
  [[0,1],[1,2],[0,2]].forEach(([a,b])=>{ edges.push([a,b]); rep.push(a,b); });
  for (let v=3; v<n; v++){ const tg = new Set(); while (tg.size < m) tg.add(rep[Math.floor(r()*rep.length)]);
    for (const u of tg){ edges.push([v,u]); rep.push(v,u); } }
  const nb = Array.from({length:n}, ()=>[]); edges.forEach(([a,b])=>{ nb[a].push(b); nb[b].push(a); });
  const deg = nb.map(l=>l.length), favg = nb.map(l=>l.reduce((s,j)=>s+deg[j],0)/l.length);
  const par = deg.map((d,i)=>favg[i] > d), nPar = par.filter(Boolean).length;
  const X = new Float64Array(n), Y = new Float64Array(n);
  for (let i=0;i<n;i++){ const a = r()*Math.PI*2, d = Math.sqrt(r()); X[i] = Math.cos(a)*d; Y[i] = Math.sin(a)*d; }
  const k = Math.sqrt(4/n), DX = new Float64Array(n), DY = new Float64Array(n), IT = 140;
  for (let it=0; it<IT; it++){ DX.fill(0); DY.fill(0);
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){ let dx = X[i]-X[j], dy = Y[i]-Y[j]; const d2 = dx*dx+dy*dy+1e-6, f = k*k/d2;
      dx*=f; dy*=f; DX[i]+=dx; DY[i]+=dy; DX[j]-=dx; DY[j]-=dy; }
    for (const [a,b] of edges){ const dx = X[a]-X[b], dy = Y[a]-Y[b], d = Math.sqrt(dx*dx+dy*dy)+1e-9, f = d/k;
      DX[a]-=dx*f; DY[a]-=dy*f; DX[b]+=dx*f; DY[b]+=dy*f; }
    const temp = .12*(1-it/IT)+.003;
    for (let i=0;i<n;i++){ DX[i]-=X[i]*.6; DY[i]-=Y[i]*.6; const d = Math.sqrt(DX[i]*DX[i]+DY[i]*DY[i])+1e-9, s = Math.min(d,temp)/d; X[i]+=DX[i]*s; Y[i]+=DY[i]*s; } }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (let i=0;i<n;i++){ x0=Math.min(x0,X[i]); x1=Math.max(x1,X[i]); y0=Math.min(y0,Y[i]); y1=Math.max(y1,Y[i]); }
  const P = Array.from({length:n}, (_,i)=>[((X[i]-x0)/(x1-x0)-.5)*34, ((Y[i]-y0)/(y1-y0)-.5)*19]);
  return {n, edges, deg, par, nPar, pct: nPar/n*100, P, rank: Array.from({length:n}, ()=>r())};
})();

name: Build APK

on:
  push:
    paths:
      - 'android-snake/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    name: 单元测试 + 构建 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android-snake
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: JS 单元测试（node --test）
        run: |
          npm test 2>&1 | tee unit-test.log
          {
            echo '## 单元测试'
            echo '```'
            grep -E '^ℹ (tests|pass|fail|duration_ms)|^AI ' unit-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5.0.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: assembleDebug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 校验 APK（包名、SDK、权限、离线资源）
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump badging "$apk" > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission|launchable-activity)" badging.txt
          grep -q "package: name='com.abffweh.snake'" badging.txt
          grep -q "sdkVersion:'26'" badging.txt
          grep -q "targetSdkVersion:'34'" badging.txt
          grep -q "application-label:'贪吃蛇'" badging.txt
          # 唯一允许的权限是 VIBRATE
          perms="$(grep '^uses-permission:' badging.txt)"
          [ "$perms" = "uses-permission: name='android.permission.VIBRATE'" ] || { echo "权限不符：$perms"; exit 1; }
          # index.html 引用的每个文件都必须打包进 assets
          unzip -l "$apk" > apk-files.txt
          grep -q ' assets/index.html$' apk-files.txt
          for f in $(grep -oE '(src|href)="[^"]+"' app/src/main/assets/index.html | sed -E 's/^[a-z]+="//; s/"$//'); do
            grep -q " assets/$f\$" apk-files.txt || { echo "APK 缺少 assets/$f"; exit 1; }
            echo "已打包 assets/$f"
          done
          # 离线：网页资源里不能有任何外部 URL
          if grep -rnE 'https?://' app/src/main/assets; then echo '发现外部 URL'; exit 1; fi
          # 签名必须是仓库里固定的 debug 密钥（保证新版能直接覆盖安装）
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs "$apk" | tee signer.txt
          grep -q "SHA-256 digest: ${DEBUG_CERT_SHA256}" signer.txt || { echo '签名证书与固定 debug 密钥不一致'; exit 1; }
        env:
          DEBUG_CERT_SHA256: 8b0b824fb7eedd108b5ca40090811663f0bcebf2dcbcd459f25ae524126a2759

      - name: 整理 APK
        run: |
          mkdir -p dist
          apk="dist/snake-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          ls -l dist
          {
            echo '## APK'
            echo "- 文件：\`$(basename "$apk")\`"
            echo "- 大小：$(du -h "$apk" | cut -f1)"
            echo "- SHA-256：\`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo "- 权限：$(grep '^uses-permission:' badging.txt | sed -E "s/.*name='([^']+)'.*/\1/" | paste -sd, -)"
            echo "- 签名证书 SHA-256：\`$(grep -m1 'SHA-256 digest' signer.txt | awk '{print $NF}')\`（固定 debug 密钥）"
            echo '- 下载：本页底部 Artifacts → snake-debug-apk'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v6.0.0
        with:
          name: snake-debug-apk
          path: android-snake/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: 网页端到端测试（Playwright）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: android-snake
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: android-snake/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright 测试（1280×800 与 800×1280）
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/android-snake/test-results/screenshots
        run: |
          npm run test:e2e 2>&1 | tee e2e.log
          {
            echo '## 端到端测试（Playwright）'
            echo '```'
            grep -E '^(✔|✖)|^ℹ (帧率|tests|pass|fail|duration_ms)' e2e.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: e2e-screenshots
          path: android-snake/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

name: Build APK

on:
  push:
    paths:
      - 'android-snake/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    name: 单元测试 + 构建 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: android-snake
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: JS 单元测试（node --test）
        run: |
          npm test 2>&1 | tee unit-test.log
          {
            echo '## 单元测试'
            echo '```'
            grep -E '^ℹ (tests|pass|fail|duration_ms)|AI ' unit-test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: assembleDebug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 整理 APK
        run: |
          mkdir -p dist
          apk="dist/snake-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          ls -l dist
          {
            echo '## APK'
            echo "- 文件：\`$(basename "$apk")\`"
            echo "- 大小：$(du -h "$apk" | cut -f1)"
            echo "- SHA-256：\`$(sha256sum "$apk" | cut -d' ' -f1)\`"
            echo '- 下载：本页底部 Artifacts → snake-debug-apk'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: snake-debug-apk
          path: android-snake/dist/*.apk
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: 网页端到端测试（Playwright）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: android-snake
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: android-snake/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright 测试（1280×800 与 800×1280）
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/android-snake/test-results/screenshots
        run: npm run test:e2e

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-screenshots
          path: android-snake/test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14

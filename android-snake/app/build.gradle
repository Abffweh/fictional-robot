plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abffweh.snake'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abffweh.snake'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 固定的 debug 签名：CI 每次都在全新机器上构建，如果用自动生成的 debug 密钥，
    // 每个 APK 的签名都不同，装新版时必须先卸载（本地记录会丢）。
    // 这是公开口令（android）的 debug 密钥，只适合个人自用，不能用于上架。
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 外壳不依赖任何第三方库：只用 Android 框架自带的 WebView。

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abffweh.snake'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abffweh.snake'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 外壳不依赖任何第三方库：只用 Android 框架自带的 WebView。

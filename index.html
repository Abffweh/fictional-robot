<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metamorphosis — The Life of a Monarch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #D5CAAD; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #plate {
    position: relative;
    width: min(96vw, 96vh); height: min(96vw, 96vh);
    box-shadow: 0 1px 2px rgba(58,49,37,.16), 0 14px 44px rgba(58,49,37,.16);
  }
  #plate svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* static paper layers get their own compositing layers so their filters rasterize once */
  #bg, #fx { will-change: transform; }
  #fx { pointer-events: none; mix-blend-mode: multiply; }
  text { font-family: 'Alegreya', 'EB Garamond', Georgia, serif; }
  .ui { cursor: pointer; }
  #scrub { opacity: .16; transition: opacity .45s ease; cursor: pointer; }
  #scrub:hover, #scrub.drag { opacity: .85; }
  #menu .mi { opacity: .72; transition: opacity .25s; }
  #menu .mi:hover { opacity: 1; }
</style>
</head>
<body>
<div id="plate">

<!-- ================= STATIC PAPER (rendered once) ================= -->
<svg id="bg" viewBox="0 0 1000 1000" aria-hidden="true">
  <defs>
    <filter id="fMottle" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="3" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .83  0 0 0 0 .78  0 0 0 0 .66  1.4 0 0 0 -.55"/>
    </filter>
    <filter id="fCloud" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0058" numOctaves="4" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .73  0 0 0 0 .67  0 0 0 0 .52  2.1 0 0 0 -.86"/>
    </filter>
    <filter id="fCloudLight" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.0045" numOctaves="4" seed="29"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .94  0 0 0 0 .91  0 0 0 0 .84  2.3 0 0 0 -1.02"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#E7DEC6"/>
  <rect width="1000" height="1000" fill="#000" filter="url(#fMottle)" opacity=".5"/>
  <rect x="48" y="48" width="904" height="832" fill="#DDD3B8"/>
  <rect x="48" y="48" width="904" height="832" fill="#000" filter="url(#fCloud)" opacity=".55"/>
  <rect x="48" y="48" width="904" height="832" fill="#000" filter="url(#fCloudLight)" opacity=".6"/>
</svg>

<!-- ================= ANIMATED PLATE ================= -->
<svg id="main" viewBox="0 0 1000 1000" role="img" aria-label="Metamorphosis — the life of a monarch butterfly, animated as a natural-history plate">
  <defs id="defs">
    <clipPath id="frameClip"><rect x="48.5" y="48.5" width="903" height="831"/></clipPath>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="3.4" height="3.4" patternTransform="rotate(38)">
      <rect width=".62" height="3.4" fill="#2F281E"/></pattern>
    <pattern id="hatchFine" patternUnits="userSpaceOnUse" width="2.4" height="2.4" patternTransform="rotate(-32)">
      <rect width=".45" height="2.4" fill="#2F281E"/></pattern>
    <pattern id="hatchDense" patternUnits="userSpaceOnUse" width="2.3" height="2.3" patternTransform="rotate(24)">
      <rect width=".8" height="2.3" fill="#2F281E"/></pattern>
    <radialGradient id="gShadow">
      <stop offset="0" stop-color="#2F281E" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#2F281E" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2F281E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B2B37B" stop-opacity=".0"/>
      <stop offset=".55" stop-color="#8B8C57" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8B8C57" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="gShadeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#000"/><stop offset=".9" stop-color="#fff"/>
    </linearGradient>
    <mask id="shadeSideMask" maskUnits="userSpaceOnUse" x="-100" y="300" width="1300" height="800">
      <rect x="-100" y="300" width="1300" height="800" fill="url(#gShadeSide)"/>
    </mask>
    <linearGradient id="gChrys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E9E7E"/>
      <stop offset=".42" stop-color="#C4C7AB"/>
      <stop offset=".7" stop-color="#B1B898"/>
      <stop offset="1" stop-color="#95A383"/>
    </linearGradient>
    <linearGradient id="gTwig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A09267"/><stop offset=".45" stop-color="#8A7D55"/><stop offset="1" stop-color="#6A5E3E"/>
    </linearGradient>
    <mask id="biteMask" maskUnits="userSpaceOnUse" x="-200" y="200" width="1500" height="900">
      <rect x="-200" y="200" width="1500" height="900" fill="#fff"/>
      <g id="biteHoles" fill="#000"></g>
    </mask>
    <mask id="eggMask" maskUnits="userSpaceOnUse" x="-40" y="-90" width="80" height="110">
      <rect x="-40" y="-90" width="80" height="110" fill="#fff"/>
      <path id="eggCut" fill="#000" d="M0 0"/>
      <path id="eggHole" fill="#000" d="M0 0"/>
    </mask>
    <mask id="shellMask" maskUnits="userSpaceOnUse" x="-120" y="-40" width="240" height="340">
      <rect x="-120" y="-40" width="240" height="340" fill="#fff"/>
      <path id="shellCut" fill="#000" fill-opacity="0" d="M0 0"/>
    </mask>
    <path id="pupaShape" d="M0 0"/>
    <clipPath id="chrysClip"><use href="#pupaShape"/></clipPath>
    <!-- hidden guide geometry sampled with getPointAtLength -->
    <path id="leafEdgeGuide" d="M-60 790 C 60 640, 290 505, 480 503 C 690 501, 900 590, 1040 735 C 1075 772, 1100 810, 1130 860"/>
    <path id="twigGuide" d="M-140 160 C 200 104, 720 106, 1140 226"/>
    <path id="exitGuide" d="M0 0"/>
    <path id="twigUnderGuide" d="M0 0"/>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect id="dayLight" x="48" y="48" width="904" height="832" fill="#F4EFDF" opacity="0"/>
    <rect id="dayDark" x="48" y="48" width="904" height="832" fill="#5B5033" opacity="0"/>

    <g id="cam">
      <g id="leafScene" display="none">
        <g id="dome" mask="url(#biteMask)"></g>
        <g id="eggShadowG"></g>
        <g id="eggG"></g>
        <g id="husks"></g>
        <path id="trail" fill="none" stroke="#3A3125" stroke-width="1" stroke-dasharray="1.2 3.4" stroke-linecap="round" opacity="0" d="M0 0"/>
        <g id="larvaLayer"></g>
        <use id="eggFront" href="#eggG" display="none"/>
        <g id="scaleBar" opacity="0">
          <line id="sbLine" y1="0" y2="0" stroke="#3A3125" stroke-width=".7" stroke-dasharray="3 2.2"/>
          <line id="sbT1" y1="-3" y2="3" stroke="#3A3125" stroke-width=".7"/>
          <line id="sbT2" y1="-3" y2="3" stroke="#3A3125" stroke-width=".7"/>
          <text id="sbText" y="14" text-anchor="middle" font-size="11" font-style="italic" fill="#3A3125" fill-opacity=".85">2 mm</text>
        </g>
        <g id="fgLeaf"></g>
      </g>

      <g id="twigScene" display="none">
        <g id="twigG"></g>
        <g id="padG"></g>
        <g id="bflyG"></g>
        <g id="pupaG"></g>
        <g id="hangLayer"></g>
      </g>

      <g id="callouts"></g>
    </g>

    <g id="titleCard" opacity="0" fill="#3A3125">
      <text x="500" y="442" text-anchor="middle" font-size="46" font-style="italic" fill-opacity=".88">Danaus plexippus</text>
      <line id="titleRule" x1="410" y1="466" x2="590" y2="466" stroke="#3A3125" stroke-width=".7" stroke-dasharray="180 180" stroke-dashoffset="180"/>
      <text x="500" y="498" text-anchor="middle" font-size="18" font-style="italic" fill-opacity=".78">the monarch, from egg to imago</text>
    </g>
  </g>

  <!-- ================= FOOTER / HUD ================= -->
  <g id="footer" fill="#3A3125" fill-opacity=".85">
    <g id="chapBtn" class="ui">
      <rect x="44" y="903" width="240" height="32" fill="transparent"/>
      <text id="numB" x="52" y="925" font-size="13.5"></text>
      <text id="titB" x="96" y="925" font-size="15" font-style="italic"></text>
      <text id="numA" x="52" y="925" font-size="13.5"></text>
      <text id="titA" x="96" y="925" font-size="15" font-style="italic"></text>
    </g>
    <g id="dayG">
      <circle cx="471" cy="920" r="9" fill="none" stroke="#3A3125" stroke-opacity=".22" stroke-width="1.2"/>
      <circle id="ring" cx="471" cy="920" r="9" fill="none" stroke="#3A3125" stroke-opacity=".85" stroke-width="1.2"
              stroke-dasharray="56.55 56.55" stroke-dashoffset="56.55" transform="rotate(-90 471 920)"/>
      <text id="dayT" x="487" y="925" font-size="15" font-style="italic">day 0</text>
    </g>
    <text x="948" y="925" text-anchor="end" font-size="15" font-style="italic">Life cycle shown in time-lapse.</text>
    <text id="pausedT" x="500" y="944" text-anchor="middle" font-size="11.5" font-style="italic" opacity="0">paused</text>
  </g>

  <g id="scrub">
    <rect x="40" y="949" width="920" height="24" fill="transparent"/>
    <line x1="48" y1="960" x2="952" y2="960" stroke="#3A3125" stroke-width=".5"/>
    <g id="scrubTicks" stroke="#3A3125" stroke-width=".6"></g>
    <line id="scrubFill" x1="48" y1="960" x2="48" y2="960" stroke="#3A3125" stroke-width="1.3"/>
    <circle id="scrubKnob" cx="48" cy="960" r="2.6" fill="#3A3125"/>
  </g>

  <g id="menu" display="none">
    <rect x="44" y="733" width="214" height="168" fill="#EFE8D4" stroke="#3A3125" stroke-width=".6" stroke-opacity=".7"/>
    <g id="menuItems" fill="#3A3125"></g>
  </g>
</svg>

<!-- ================= STATIC OVERLAY: grain, vignette, rules ================= -->
<svg id="fx" viewBox="0 0 1000 1000" aria-hidden="true">
  <defs>
    <filter id="fGrain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .23  0 0 0 0 .19  0 0 0 0 .14  3.2 0 0 0 -1.72"/>
    </filter>
    <filter id="fFleck" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="3" seed="17"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  7 0 0 0 -4.9"/>
    </filter>
    <radialGradient id="gVig" cx=".5" cy=".5" r=".72">
      <stop offset=".62" stop-color="#5B5033" stop-opacity="0"/>
      <stop offset="1" stop-color="#5B5033" stop-opacity=".2"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" fill="#000" filter="url(#fGrain)" opacity=".42"/>
  <rect width="1000" height="1000" fill="#000" filter="url(#fFleck)" opacity=".13"/>
  <rect width="1000" height="1000" fill="url(#gVig)"/>
  <rect x="16" y="16" width="968" height="968" fill="none" stroke="#6E5F46" stroke-width="1" stroke-opacity=".75"/>
  <rect x="20" y="20" width="960" height="960" fill="none" stroke="#6E5F46" stroke-width=".5" stroke-opacity=".65"/>
  <rect x="48" y="48" width="904" height="832" fill="none" stroke="#3A3125" stroke-width="1"/>
  <rect x="51.5" y="51.5" width="897" height="825" fill="none" stroke="#3A3125" stroke-width=".4" stroke-opacity=".45"/>
</svg>
</div>

<script>
'use strict';
/* =====================================================================
   0. SETUP — palette, constants, DOM helpers
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('main'), defs = $('defs');

const PAL = {
  paper: '#E7DEC6', paperLight: '#EFE8D4', paperShadow: '#D3C7A8',
  ink: '#3A3125', outline: '#2F281E',
  leaf: '#A4A56C', leafShade: '#8B8C57', vein: '#E4DEC2',
  twig: '#8A7D55', twigShadow: '#5B5033',
  egg: '#E9E0C4', eggRib: '#B6AA86',
  catYellow: '#D6B45A', catBlack: '#2A2520', catWhite: '#ECE5D0',
  sage: '#B9BCA0', jade: '#9FB08E', gold: '#C9A24A',
  orange: '#C0652A', deepOrange: '#9A4A1E', wingBlack: '#221D18', spot: '#F1EBDC'
};
const TOTAL = 80;                       // seconds per loop
const FC = { x: 500, y: 464 };          // centre of the picture frame
const NSEG = 11;                        // caterpillar body segments
const WAVE = 0.42;                      // peristaltic wave width (fraction of body)

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
/* write an attribute only when its value actually changed */
function setA(e, k, v) { const c = '_' + k; if (e[c] !== v) { e[c] = v; e.setAttribute(k, v); } }
function show(e, on) { setA(e, 'display', on ? 'inline' : 'none'); }

/* =====================================================================
   1. HELPERS — math, easing, colour, paths
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, k) => a + (b - a) * k;
const smoothstep = (e0, e1, x) => { const k = clamp((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };
const easeInOutSine = k => -(Math.cos(Math.PI * clamp(k)) - 1) / 2;
const easeInOutCubic = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const F = v => Math.round(v * 100) / 100;
const DEG = 180 / Math.PI;
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const angLerp = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; };
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, k) {
  const A = hexRGB(a), B = hexRGB(b);
  return 'rgb(' + Math.round(lerp(A[0], B[0], k)) + ',' + Math.round(lerp(A[1], B[1], k)) + ',' + Math.round(lerp(A[2], B[2], k)) + ')';
}

/* Catmull-Rom → cubic Bézier, closed and open */
function smoothClosed(P) {
  const n = P.length; let d = 'M' + F(P[0][0]) + ' ' + F(P[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    d += 'C' + F(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + F(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
         F(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + F(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + F(p2[0]) + ' ' + F(p2[1]);
  }
  return d + 'Z';
}
function smoothOpen(P) {
  const n = P.length; let d = 'M' + F(P[0][0]) + ' ' + F(P[0][1]);
  for (let i = 0; i < n - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    d += 'C' + F(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + F(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
         F(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + F(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + F(p2[0]) + ' ' + F(p2[1]);
  }
  return d;
}
function polyline(P, close) {
  let d = 'M' + F(P[0][0]) + ' ' + F(P[0][1]);
  for (let i = 1; i < P.length; i++) d += 'L' + F(P[i][0]) + ' ' + F(P[i][1]);
  return close ? d + 'Z' : d;
}
function circlePath(x, y, r) {
  return 'M' + F(x - r) + ' ' + F(y) + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0Z';
}

/* Path interpolation: two paths with identical command structure are split into
   string/number templates once, then blended number-by-number every frame. */
function pathTemplate(d) {
  const parts = d.split(/(-?\d+(?:\.\d+)?)/);
  const strs = [], nums = [];
  for (let i = 0; i < parts.length; i++) (i % 2 ? nums : strs).push(i % 2 ? +parts[i] : parts[i]);
  return { strs, nums };
}
function pathLerp(A, B, k) {
  let s = A.strs[0];
  for (let i = 0; i < A.nums.length; i++) s += F(lerp(A.nums[i], B.nums[i], k)) + A.strs[i + 1];
  return s;
}

/* Arc-length lookup tables sampled once from guide paths with getPointAtLength */
function makeLUT(pathEl, step) {
  const len = pathEl.getTotalLength(), n = Math.max(8, Math.ceil(len / step));
  const X = new Float64Array(n + 1), Y = new Float64Array(n + 1), A = new Float64Array(n + 1);
  for (let i = 0; i <= n; i++) { const p = pathEl.getPointAtLength(len * i / n); X[i] = p.x; Y[i] = p.y; }
  for (let i = 0; i <= n; i++) {
    const a = Math.max(0, i - 2), b = Math.min(n, i + 2);
    A[i] = Math.atan2(Y[b] - Y[a], X[b] - X[a]);
    if (i) { while (A[i] - A[i - 1] > Math.PI) A[i] -= 2 * Math.PI; while (A[i] - A[i - 1] < -Math.PI) A[i] += 2 * Math.PI; }
  }
  return { len, n, ds: len / n, X, Y, A };
}
function lutAt(L, s) {
  if (s <= 0) { const a = L.A[0]; return { x: L.X[0] + Math.cos(a) * s, y: L.Y[0] + Math.sin(a) * s, a }; }
  if (s >= L.len) { const a = L.A[L.n], e = s - L.len; return { x: L.X[L.n] + Math.cos(a) * e, y: L.Y[L.n] + Math.sin(a) * e, a }; }
  const f = s / L.ds, i = Math.min(L.n - 1, Math.floor(f)), k = f - i;
  return { x: lerp(L.X[i], L.X[i + 1], k), y: lerp(L.Y[i], L.Y[i + 1], k), a: lerp(L.A[i], L.A[i + 1], k) };
}
function sAtX(L, x, descending) {
  for (let i = 0; i <= L.n; i++) if (descending ? L.X[i] <= x : L.X[i] >= x) return i * L.ds;
  return L.len;
}
/* outward normal of a surface tangent a is (sin a, −cos a) */
const offsetPt = (p, h) => ({ x: p.x + Math.sin(p.a) * h, y: p.y - Math.cos(p.a) * h, a: p.a });

/* =====================================================================
   2. TIMELINE — chapter data, day counter
   ===================================================================== */
const CHAPTERS = [
  { id: 'egg', numeral: 'I', title: 'The egg', start: 4, end: 14, dayStart: 0, dayEnd: 4,
    dayKeys: [[4, 0], [10, 3], [11.2, 4], [14, 4]] },
  { id: 'caterpillar', numeral: 'II', title: 'The caterpillar', start: 14, end: 36, dayStart: 4, dayEnd: 16 },
  { id: 'j', numeral: 'III', title: 'The J', start: 36, end: 44, dayStart: 16, dayEnd: 17,
    dayKeys: [[36, 16], [42, 16.9], [44, 17]] },
  { id: 'chrysalis', numeral: 'IV', title: 'The chrysalis', start: 44, end: 58, dayStart: 17, dayEnd: 27,
    dayKeys: [[44, 17], [50, 17.95], [56, 25], [58, 27]] },
  { id: 'eclosion', numeral: 'V', title: 'Eclosion', start: 58, end: 70, dayStart: 27, dayEnd: 27 },
  { id: 'imago', numeral: 'VI', title: 'The imago', start: 70, end: 80, dayStart: 28, dayEnd: 28 }
];
function chapterIndex(t) { let c = -1; for (let i = 0; i < CHAPTERS.length; i++) if (t >= CHAPTERS[i].start) c = i; return c; }
function dayAt(t) {
  const c = chapterIndex(t); if (c < 0) return 0;
  const C = CHAPTERS[c];
  if (C.dayKeys) {
    const K = C.dayKeys;
    for (let i = 0; i < K.length - 1; i++) if (t <= K[i + 1][0]) return lerp(K[i][1], K[i + 1][1], seg(t, K[i][0], K[i + 1][0]));
    return K[K.length - 1][1];
  }
  return lerp(C.dayStart, C.dayEnd, seg(t, C.start, C.end));
}

/* per-frame shared state (anchors for callouts etc.), rebuilt purely from t */
const S = {};

/* =====================================================================
   3. SCENE GEOMETRY — leaf, egg, twig (built once)
   ===================================================================== */
const leafLUT = makeLUT($('leafEdgeGuide'), 1.5);
const twigLUT = makeLUT($('twigGuide'), 2);

/* ---- milkweed leaf (background dome) ---- */
const domeG = $('dome');
const DOME_D = $('leafEdgeGuide').getAttribute('d') + ' L1130 1100 L-60 1100 Z';
el('clipPath', { id: 'domeClip' }, defs).appendChild(el('path', { d: DOME_D }));
el('path', { d: DOME_D, fill: PAL.leaf }, domeG);
el('path', { d: DOME_D, fill: 'url(#gLeaf)' }, domeG);
(function buildLeaf() {

  for (const L of R.legs) {
    const A = C[L.i], Bc = C[L.i + 1];
    const mx = (A.x + Bc.x) / 2, my = (A.y + Bc.y) / 2, a = Math.atan2(Bc.y - A.y, Bc.x - A.x), r = (A.r + Bc.r) / 2;
    const lift = 1 - .35 * Math.max(P.bump[L.i], P.bump[L.i + 1]);
    const tr = `translate(${F(mx)} ${F(my)}) rotate(${F(a * DEG)}) scale(${F(r)} ${F(r * lift)})`;
    L.near.setAttribute('transform', tr);
    L.far.setAttribute('transform', tr + ' translate(0.22 -0.05)');
  }
  // filaments with lagging secondary motion
  const pairs = [{ i: 9, f: true }, { i: 1, f: false }];
  let fi = 0;
  for (const pr of pairs) {
    const A = C[pr.i], Bc = C[pr.i + 1], m = interpC(A, Bc, .5);
    const lag = (P.lagBump[pr.i] + P.lagBump[pr.i + 1]) / 2;
    for (let side = 0; side < 2; side++) {
      const off = (side ? .2 : -.2) * m.r;
      const rx = m.x + Math.cos(m.a) * off + Math.sin(m.a) * m.r * .8, ry = m.y + Math.sin(m.a) * off - Math.cos(m.a) * m.r * .8;
      const sway = (look.sway || 0) * (side ? 1 : .8) + .07 * Math.sin((look.time || 0) * 2.1 + pr.i + side * 1.7) - .35 * lag;
      let ang = m.a - Math.PI / 2 + (pr.f ? .42 : -.52) + sway, curve = pr.f ? .55 : -.45;
      let len = m.r * (pr.f ? look.fF : look.fR) * (side ? 1 : .92);
      const limp = look.limp || 0;
      if (limp > 0) { ang = angLerp(ang, Math.PI / 2 + (pr.f ? .5 : -.5), limp * .8); curve = lerp(curve, pr.f ? 1.6 : -1.6, limp); len *= 1 - .4 * limp; }
      len *= look.filScale == null ? 1 : look.filScale;
      const p = R.fils[fi++];
      p.setAttribute('d', filPath(rx, ry, ang, len, curve));
      setA(p, 'stroke-width', F(Math.max(.7, m.r * .11)));
      setA(p, 'stroke-opacity', side ? '0.95' : '0.7');
    }
  }
  // head
  const hx = cN.x + Math.cos(cN.a) * cN.r * .45 - Math.sin(cN.a) * cN.r * .12 + Math.cos(cN.a) * (look.headShift || 0);
  const hy = cN.y + Math.sin(cN.a) * cN.r * .45 + Math.cos(cN.a) * cN.r * .12 + Math.sin(cN.a) * (look.headShift || 0);
  const hr = cN.r * 1.05 / .86 * .9;
  R.head.setAttribute('transform', `translate(${F(hx)} ${F(hy)}) rotate(${F((cN.a + (look.pitch || 0)) * DEG)}) scale(${F(hr)})`);
  setA(R.head, 'opacity', F(look.headOp == null ? 1 : look.headOp));
  setA(R.face, 'opacity', F(clamp(look.b * 1.1)));
  R.headPt = { x: hx, y: hy, r: hr };
  if (R.shadow) {
    const sh = look.shadow;
    if (sh) {
      R.shadow.setAttribute('cx', F(sh.x)); R.shadow.setAttribute('cy', F(sh.y));
      R.shadow.setAttribute('rx', F(sh.rx)); R.shadow.setAttribute('ry', F(sh.ry));
      R.shadow.setAttribute('transform', `rotate(${F(sh.a * DEG)} ${F(sh.x)} ${F(sh.y)})`);
    }
    show(R.shadow, !!sh);
  }
}

/* =====================================================================
   5. CHAPTER I–II DATA — larva plan (crawl / feed / moult), bites, husks
   ===================================================================== */
const INSTARS = [
  { name: 'first instar', mm: [2, 5] }, { name: 'second instar', mm: [7, 9] }, { name: 'third instar', mm: [11, 13] },
  { name: 'fourth instar', mm: [16, 22] }, { name: 'fifth instar', mm: [27, 45] }
];
const LARVA_START = EXIT.joinS + lenPx(2) - 2;         // head s on the leaf once fully out of the egg
const PLAN = [], BITES = [], HUSKS = [], INSTAR_WIN = [];
(function buildPlan() {
  const tOfDay = d => 14 + (d - 4) * 22 / 12;
  const bounds = [4, 7, 9, 11, 13, 16].map(tOfDay);
  const targets = [[300, 318], [405, 420], [515, 530], [630, 645], [728, 800]];
  let h = LARVA_START, mm = 2;
  const crawl = (t0, t1, anchor, sRest, d, L, k) =>
    PLAN.push({ type: 'crawl', t0, t1, anchor, sRest, d, m: Math.max(1, Math.round(d / (.12 * L))), k, mm0: mm, mm1: mm });
  for (let k = 0; k < 5; k++) {
    const a = bounds[k], b = bounds[k + 1], I = INSTARS[k];
    let t;
    if (k === 0) { // hatchling rests, curls back to eat its shell, straightens
      PLAN.push({ type: 'hold', t0: 12.9, t1: 14.6, anchor: 'head', sRest: h, k, mm0: 2, mm1: 2, bend: true });
      t = 14.6;
    } else {      // moult: crawl forward out of the old skin, a size larger
      const Lold = lenPx(mm), Lnew = lenPx(I.mm[0]), tail = h - Lold, d = .2 * Lnew;
      PLAN.push({ type: 'exit', t0: a, t1: a + .9, anchor: 'tail', sRest: tail, d, m: Math.max(1, Math.round(d / (.12 * Lnew))), k, mm0: mm, mm1: I.mm[0] });
      HUSKS.push({ t0: a, s: tail + .2 * Lold, len: .3 * Lold, r: .068 * Lold });
      mm = I.mm[0]; h = tail + d + Lnew; t = a + .9;
    }
    INSTAR_WIN.push([t - .1, b - .22]);
    const rest = b - t, fr = k < 4 ? [.34, .36, .12, .18] : [.3, .36, .34, 0];
    let L = lenPx(mm), tgt = Math.max(sAtX(leafLUT, targets[k][0]), h + .12 * L);
    crawl(t, t + fr[0] * rest, 'head', h, tgt - h, L, k); h = tgt; t += fr[0] * rest;
    const r1 = .068 * lenPx(I.mm[1]);
    const bite = { t0: t, t1: t + fr[1] * rest, s: h + r1 * 1.05, R: r1 * 1.55, chews: 4 + k };
    BITES.push(bite);
    PLAN.push({ type: 'feed', t0: t, t1: t + fr[1] * rest, anchor: 'head', sRest: h, k, mm0: mm, mm1: I.mm[1], bite });
    mm = I.mm[1]; t += fr[1] * rest; L = lenPx(mm);
    tgt = Math.max(sAtX(leafLUT, targets[k][1]), h + .08 * L);
    crawl(t, t + fr[2] * rest, 'head', h, tgt - h, L, k); h = tgt; t += fr[2] * rest;
    if (k < 4) PLAN.push({ type: 'hold', t0: t, t1: b, anchor: 'head', sRest: h, k, mm0: mm, mm1: mm, dull: true });
  }
  // chapter III opening: the grown caterpillar walks off the right side of the leaf
  const L = lenPx(45);
  crawl(36, 37.7, 'head', h, 400, L, 4);
})();

function biteRadius(b, t) {
  const p = seg(t, b.t0 + .08 * (b.t1 - b.t0), b.t1 - .06 * (b.t1 - b.t0));
  if (p <= 0) return 0;
  const f = p * b.chews, i = Math.floor(f);
  const k = i >= b.chews ? 1 : (i + smoothstep(.15, .65, f - i)) / b.chews;
  return b.R * Math.sqrt(k);
}
(function buildBites() {
  for (const b of BITES) {
    const p = lutAt(leafLUT, b.s);
    b.cx = p.x; b.cy = p.y;
    b.hole = el('circle', { cx: F(p.x), cy: F(p.y), r: 0 }, $('biteHoles'));
    b.rim = el('circle', { cx: F(p.x), cy: F(p.y), r: 0 }, S.notchRims);
  }
})();
(function buildHusks() {
  for (const h of HUSKS) {
    const g = el('g', { opacity: 0 }, $('husks'));
    const pts = [];
    for (let i = 0; i < 22; i++) {
      const a = i / 22 * Math.PI * 2, j = 1 + .34 * (hash(i * 3.1 + h.s) - .5);
      pts.push([Math.cos(a) * .5 * j, Math.sin(a) * .42 * j * (a > Math.PI ? 1.1 : .7) - .08]);
    }
    const outline = polyline(pts, true);
    el('clipPath', { id: 'husk' + HUSKS.indexOf(h) }, defs).appendChild(el('path', { d: outline }));
    el('path', { d: outline, fill: '#9E9888', stroke: PAL.outline, 'stroke-width': .75, 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }, g);
    const bands = el('g', { 'clip-path': `url(#husk${HUSKS.indexOf(h)})`, fill: PAL.catBlack, opacity: .28 }, g);
    for (let i = 0; i < 5; i++) el('rect', { x: F(-.42 + i * .19 + .04 * hash(i + h.s)), y: -.6, width: .06, height: 1.2, transform: `rotate(${F(12 * (hash(i + 5) - .5))})` }, bands);
    el('path', { d: 'M-0.34 -0.12 l0.12 0.08 l0.1 -0.1 l0.12 0.1 M-0.1 0.08 l0.14 -0.06 l0.12 0.07 l0.14 -0.08', fill: 'none', stroke: PAL.outline, 'stroke-width': .5, 'vector-effect': 'non-scaling-stroke', opacity: .65 }, g);
    el('path', { d: 'M0.4 -0.32 q0.08 -0.2 -0.02 -0.34 M0.44 -0.28 q0.14 -0.16 0.08 -0.3', fill: 'none', stroke: PAL.catBlack, 'stroke-width': .8, 'vector-effect': 'non-scaling-stroke' }, g);
    const p = offsetPt(lutAt(leafLUT, h.s), h.r * .5);
    g.setAttribute('transform', `translate(${F(p.x)} ${F(p.y)}) rotate(${F(p.a * DEG)}) scale(${F(h.len)} ${F(h.r * 1.5)})`);
    h.g = g;
  }
})();

/* the larva's state on the leaf is a pure function of t, looked up in PLAN */
function larvaState(t) {
  let P = PLAN[0];
  for (const q of PLAN) { if (t >= q.t0) P = q; else break; }
  const u = seg(t, P.t0, P.t1);
  const st = { anchor: P.anchor, sRest: P.sRest, sigma: 0, phi: 0, k: P.k, colorK: P.k, dull: 0, pitch: .05, dip: 0, bend: 0, headShift: 0 };
  let mm = P.mm0;
  if (P.type === 'crawl' || P.type === 'exit') {
    const n = P.m * (.8 * u + .2 * easeInOutSine(u));
    let kk = Math.floor(n), ph = n - kk; if (kk >= P.m) { kk = P.m; ph = 0; }
    st.sigma = P.d / P.m; st.phi = ph; st.sRest = P.sRest + kk * st.sigma;
    if (P.type === 'exit') {
      mm = lerp(P.mm0, P.mm1, easeInOutCubic(seg(u, 0, .7)));
      st.colorK = P.k - 1 + easeInOutSine(seg(u, .05, .75));
      st.dull = .5 * (1 - seg(u, 0, .35));
    }
  } else if (P.type === 'feed') {
    mm = lerp(P.mm0, P.mm1, easeInOutSine(u));
    const env = smoothstep(0, .08, u) * (1 - smoothstep(.92, 1, u));
    st.pitch = .05 + env * (.5 + .24 * Math.sin(2 * Math.PI * u * P.bite.chews * 2));
    st.headShift = env * .12 * st.pitch;
    st.dip = env * biteRadius(P.bite, t) * .5;
  } else if (P.type === 'hold') {
    if (P.dull) { st.dull = .5 * smoothstep(.1, .7, u); st.pitch = .05 + .12 * smoothstep(0, .4, u); }
    if (P.bend) {
      st.bend = smoothstep(12.9, 13.25, t) * (1 - smoothstep(13.85, 14.5, t));
      const chew = seg(t, 13.2, 13.85);
      st.pitch = .05 + (chew > 0 && chew < 1 ? .35 + .3 * Math.sin(chew * Math.PI * 8) : 0) * st.bend;
    }
  }
  st.mm = mm; st.L = lenPx(mm); st.R = .068 * st.L;
  return st;
}

/* =====================================================================
   6. SCENE — CHAPTERS I & II (and the start of III) on the leaf
   ===================================================================== */
const leafRig = createRig($('larvaLayer'), 'leafRig', true);
const leafPose = makePose();

function renderEgg(t) {
  show($('eggFront'), t >= 11.3 && t < 12.9);
  const dark = .85 * smoothstep(9, 11, t) * (1 - seg(t, 11.35, 11.6));
  setA(EGG.dark, 'opacity', F(dark));
  setA(EGG.body, 'fill', t < 8 ? PAL.egg : mixHex(PAL.egg, '#D8D0B8', smoothstep(8, 11, t)));
  const holeR = 7 * easeInOutSine(seg(t, 11.0, 11.5));
  const bites = seg(t, 13.2, 13.85) * 4, bi = Math.floor(bites);
  const cut = bi >= 4 ? 1 : (bi + smoothstep(.2, .7, bites - bi)) / 4;
  const uc = 1 - .44 * cut;
  let d = '';
  setA($('eggHole'), 'd', holeR > .05 ? circlePath(0, -EGG_H + 1.5, F(holeR)) : 'M0 0');
  if (uc < .995) {
    const y0 = -EGG_H * uc, line = [];
    for (let i = 0; i <= 10; i++) line.push([19 - i * 3.8, y0 + EGG.jag[i] * 2.4]);
    d += 'M24 -78 L24 ' + F(y0) + polyline(line).replace('M', 'L') + 'L-24 ' + F(y0) + 'L-24 -78Z';
    EGG.rim.setAttribute('d', polyline(line));
    setA(EGG.inner, 'cy', F(y0)); setA(EGG.inner, 'rx', F(eggHW(uc) * .85));
  }
  setA(EGG.rim, 'opacity', uc < .995 ? '1' : '0');
  setA(EGG.inner, 'opacity', uc < .995 ? '0.75' : '0');
  setA($('eggCut'), 'd', d || 'M0 0');
  S.eggAnchor = (() => { const p = eggToWorld(7, -27); return { x: p[0], y: p[1] }; })();
}

function renderLarva(t, day) {
  if (t < 11.35) { show(leafRig.g, false); S.headPt = null; S.larva = null; return; }
  show(leafRig.g, true);
  let st, surf, s0;
  if (t < 12.9) {                          // hatching: along the exit path
    const L = lenPx(2), R = .068 * L;
    const aHead0 = EXIT.tipA - 3, aEnd = EXIT.joinA + (LARVA_START - EXIT.joinS);
    st = { anchor: 'head', L, R, sigma: 0, phi: 0, k: 0, colorK: 0, dull: 0, pitch: .05, mm: 2, dip: 0, bend: 0 };
    if (t < 11.9) st.sRest = lerp(aHead0 - 7, aHead0, easeInOutSine(seg(t, 11.35, 11.9)));
    else {
      const u = seg(t, 11.9, 12.9), m = 5, n = m * (.8 * u + .2 * easeInOutSine(u));
      let kk = Math.floor(n), ph = n - kk; if (kk >= m) { kk = m; ph = 0; }
      st.sigma = (aEnd - aHead0) / m; st.phi = ph; st.sRest = aHead0 + kk * st.sigma;
    }
    surf = exitSurf;
  } else { st = larvaState(t); surf = leafSurf; }
  surfacePose(leafPose, surf, st);
  if (st.bend > 0) bendPose(leafPose, .14, -3.45 * st.bend);
  fixAngles(leafPose);

  const look = instarLook(st.colorK);
  const dayPh = Math.sin(2 * Math.PI * (day - Math.floor(day)));
  look.dull = st.dull; look.pitch = st.pitch; look.headShift = (st.headShift || 0) * st.R; look.time = t;
  const tailS = leafPose.s[0], headS = leafPose.s[NSEG];
  if (surf === leafSurf) {
    const mid = lutAt(leafLUT, (tailS + headS) / 2);
    look.shadow = { x: mid.x - Math.sin(mid.a) * st.R * .5 + Math.cos(mid.a) * dayPh * st.R * .6, y: mid.y + Math.cos(mid.a) * st.R * .5,
      a: mid.a, rx: st.L * .56, ry: st.R * .75 };
  } else look.shadow = null;
  drawRig(leafRig, leafPose, look);
  S.larva = { st, tailS, headS, surf };
  S.headPt = { x: leafRig.headPt.x, y: leafRig.headPt.y };
}

function renderTrail(t) {
  const tr = $('trail'), L = S.larva;
  const on = t >= 14.3 && L && L.surf === leafSurf;
  const sEnd = on ? L.tailS - L.st.R * .9 - 5 : 0, sStart = EXIT.joinS + 2;
  if (!on || sEnd < sStart + 3) { setA(tr, 'opacity', '0'); return; }
  const pts = [];
  for (let s = sStart; s < sEnd; s += 6) { const p = offsetPt(lutAt(leafLUT, s), 1.8); pts.push([p.x, p.y]); }
  const p = offsetPt(lutAt(leafLUT, sEnd), 1.8); pts.push([p.x, p.y]);
  tr.setAttribute('d', polyline(pts));
  setA(tr, 'opacity', F(.75 * seg(t, 14.3, 15.2)));
}

function renderScaleBar(t) {
  const g = $('scaleBar'), L = S.larva;
  const vis = L && L.surf === leafSurf ? seg(t, 14.7, 15.4) * (1 - seg(t, 35.9, 36.5)) : 0;
  setA(g, 'opacity', F(vis));
  if (vis <= 0) return;
  const r = L.st.R;
  const a = lutAt(leafLUT, L.tailS - r * .5), b = lutAt(leafLUT, L.headS + r * 1.25);
  const ang = Math.atan2(b.y - a.y, b.x - a.x), len = Math.hypot(b.x - a.x, b.y - a.y);
  const off = 24 + r * .4;
  const mx = (a.x + b.x) / 2 - Math.sin(ang) * off, my = (a.y + b.y) / 2 + Math.cos(ang) * off;
  g.setAttribute('transform', `translate(${F(mx)} ${F(my)}) rotate(${F(ang * DEG)})`);
  const hl = F(len / 2);
  setA($('sbLine'), 'x1', -hl); setA($('sbLine'), 'x2', hl);
  setA($('sbT1'), 'x1', -hl); setA($('sbT1'), 'x2', -hl);
  setA($('sbT2'), 'x1', hl); setA($('sbT2'), 'x2', hl);
  const txt = Math.round(L.st.mm) + ' mm';
  if ($('sbText').textContent !== txt) $('sbText').textContent = txt;
}

function renderLeafScene(t, day) {
  const scene = $('leafScene');
  const on = t >= 4 && t < 37.7;
  show(scene, on);
  if (!on) { S.larva = null; S.headPt = null; return; }
  const rise = 430 * (1 - easeInOutCubic(seg(t, 4, 5.9)));
  S.rise = rise;
  scene.setAttribute('transform', `translate(0 ${F(rise)})`);
  $('fgLeaf').setAttribute('transform', `translate(0 ${F(rise * .45)})`);
  setA(scene, 'opacity', F(1 - seg(t, 37.0, 37.6)));
  // time-lapse light: shading shifts a little with the sun
  const ph = Math.cos(2 * Math.PI * (day - Math.floor(day)));
  setA(S.leafHatch, 'opacity', F(.26 + .06 * ph));
  for (const b of BITES) { const r = F(biteRadius(b, t)); setA(b.hole, 'r', r); setA(b.rim, 'r', r); }
  renderEgg(t);
  renderLarva(t, day);
  for (const h of HUSKS) setA(h.g, 'opacity', F(seg(t, h.t0 + .15, h.t0 + .6)));
  renderTrail(t);
  renderScaleBar(t);
  if (S.headPt) S.headPt.y += rise;
  if (S.eggAnchor) S.eggAnchor.y += rise;
}

/* =====================================================================
   7. SCENE — CHAPTER III: the J (twig, silk pad, hanging)
   ===================================================================== */
const twigRig = createRig($('hangLayer'), 'twigRig', false);
const twigPose = makePose();
const TW_L = 300, TW_R = .068 * TW_L;
const TW_HW = TWIG.sP - 1.3 * TW_R;           // head position while spinning the pad

const pad = {
  ell: el('ellipse', { cx: F(PX), cy: F(PY + 1.5), rx: 0, ry: 0, fill: PAL.spot, stroke: PAL.ink, 'stroke-width': .5, 'stroke-opacity': .5 }, $('padG')),
  strands: []
};
for (let i = 0; i < 7; i++) {
  const dx = (i - 3) * 6 + (hash(i) - .5) * 4;
  pad.strands.push(el('path', { d: `M${F(PX + dx * .4)} ${F(PY + 2)} q${F(dx * .8)} ${F(3 + hash(i + 9) * 4)} ${F(dx * 1.9)} ${F(-2 - hash(i + 3) * 2)}`,
    fill: 'none', stroke: PAL.spot, 'stroke-width': .6, opacity: 0 }, $('padG')));
}

/* chapter III/IV caterpillar & skin; returns false when not visible */
function twigLarva(t) {
  if (t < 37.4 || t > 48.5) return null;
  const look = instarLook(4);
  look.time = t;
  let sway = 0;
  if (t < 42.1) {
    const st = { R: TW_R, L: TW_L, sigma: 0, phi: 0, anchor: 'head', sRest: TW_HW, dip: 0 };
    const crawlSt = (t0, t1, anchor, s0, d, m) => {
      const u = seg(t, t0, t1), n = m * (.8 * u + .2 * easeInOutSine(u));
      let kk = Math.floor(n), ph = n - kk; if (kk >= m) { kk = m; ph = 0; }
      st.anchor = anchor; st.sigma = d / m; st.phi = ph; st.sRest = s0 + kk * st.sigma;
    };
    if (t < 39.3) crawlSt(37.4, 39.3, 'head', TW_HW - 200, 200, 3);
    else if (t < 40.4) { // weaving the silk pad
      const w = seg(t, 39.3, 40.4), env = Math.sin(Math.PI * w);
      look.pitch = .1 + env * (.45 + .25 * Math.sin(2 * Math.PI * 2.4 * (t - 39.3)));
      look.headShift = env * TW_R * .35 * Math.sin(2 * Math.PI * 1.2 * (t - 39.3));
    } else crawlSt(40.4, 42.1, 'tail', TW_HW - TW_L, TWIG.sP - (TW_HW - TW_L), 5);
    surfacePose(twigPose, twigSurf, st);
  } else {
    // hanging: stage 1 the front lets go and drops, stage 2 it curls into a J
    const k1 = easeInOutSine(seg(t, 42.1, 42.9)), k2 = easeInOutSine(seg(t, 42.7, 43.5));
    const pre = easeInOutSine(seg(t, 44.0, 44.6));                 // pre-pupa straightening
    const q = easeInOutSine(seg(t, 44.6, 46.6));                   // skin rolling up
    sway = chrysSway(t);
    let curl = lerp(2.9, 1.05, pre) * (1 - q) * k2;
    const L = lerp(TW_L, 252, pre) * (1 - .84 * q) * (1 + .01 * Math.sin(2 * Math.PI * .6 * t) * k2);
    const Rm = lerp(1, 1.1, pre) * (1 + .22 * q);
    const n0 = [Math.sin(TWIG.aP) * TW_R * 1.22, -Math.cos(TWIG.aP) * TW_R * 1.22];
    const o = rot(n0[0], n0[1], sway);
    const heading = v => {
      const w1 = smoothstep(0, 1, k1 * 1.7 - (1 - v) * .7);
      return lerp(TWIG.aP, Math.PI / 2, w1) + curl * smoothstep(.5, 1, v) + sway * w1;

    st.o = .14 + .86 * (.5 + .5 * Math.cos(ph));
    const k = Math.pow(u, 1.35), P0 = O0, P1 = { x: PX + 70, y: PY + 300 }, P2 = { x: 780, y: 300 }, P3 = { x: 1190, y: 80 };
    const b = (a, b2, c, d, s) => (1 - s) ** 3 * a + 3 * (1 - s) ** 2 * s * b2 + 3 * (1 - s) * s * s * c + s ** 3 * d;
    const x = b(P0.x, P1.x, P2.x, P3.x, k), y = b(P0.y, P1.y, P2.y, P3.y, k);
    const k2 = Math.min(1, k + .01), dx = b(P0.x, P1.x, P2.x, P3.x, k2) - x, dy = b(P0.y, P1.y, P2.y, P3.y, k2) - y;
    const wob = 12 * Math.sin(2 * Math.PI * .9 * (t - 75.6)) * smoothstep(0, .2, u);
    const L = Math.hypot(dx, dy) || 1;
    st.O = { x: x - dy / L * wob, y: y + dx / L * wob - 6 * Math.sin(ph) * smoothstep(0, .1, u) };
    st.rot = angLerp(0, Math.atan2(dy, dx) + Math.PI / 2, .75 * smoothstep(.02, .3, u));
    st.sc = lerp(1, .74, u);
    st.legsOp = 1 - smoothstep(0, .12, u);
  }
  return st;
}
function bfWorld(st, w, lx, ly) {
  const def = WING_DEFS[w], sw = lerp(.5, 1, st.e), dr = w === 'fw' ? st.droopF : st.droopH;
  let [x, y] = rot(lx * sw, ly * sw, dr); x += def.base[0]; y += def.base[1]; x *= st.o;
  [x, y] = rot(x * st.sc, y * st.sc, st.rot);
  return { x: st.O.x + x, y: st.O.y + y };
}
function renderButterfly(t) {
  const st = bflyState(t);
  show(BF.g, !!st);
  if (!st) { S.wingPt = S.imagoPt = null; return; }
  BF.g.setAttribute('transform', `translate(${F(st.O.x)} ${F(st.O.y)}) rotate(${F(st.rot * DEG)}) scale(${F(st.sc)})`);
  const sw = lerp(.5, 1, st.e), ekey = F(st.e);
  const morph = BF.lastE !== ekey; BF.lastE = ekey;
  const col = st.e < .999 ? mixHex(PAL.deepOrange, PAL.orange, clamp(st.e * 1.2)) : PAL.orange;
  const strs = {};
  if (morph) for (const w of ['hw', 'fw']) { strs[w] = {}; for (const k in BF.tpl[w]) strs[w][k] = pathLerp(BF.tpl[w][k].cr, BF.tpl[w][k].exp, clamp(st.e)); }
  for (const S2 of BF.sides) {
    S2.g.setAttribute('transform', `scale(${F(S2.side * st.o)} 1)`);
    for (const w of ['hw', 'fw']) {
      const W = S2.wings[w], def = WING_DEFS[w], dr = w === 'fw' ? st.droopF : st.droopH;
      W.g.setAttribute('transform', `translate(${def.base[0]} ${def.base[1]}) rotate(${F(dr * DEG)}) scale(${F(sw)})`);
      if (morph) {
        W.P.outline.setAttribute('d', strs[w].outline); W.P.orange.setAttribute('d', strs[w].orange); W.P.hatch.setAttribute('d', strs[w].orange);
        W.P.veins.setAttribute('d', strs[w].veins); W.P.spots.setAttribute('d', strs[w].spots); W.P.ospots.setAttribute('d', strs[w].ospots);
      }
      setA(W.P.orange, 'fill', col);
    }
  }
  setA(BF.abd, 'rx', F(st.abd));
  setA(BF.abd, 'ry', F(lerp(41, 37, clamp((15 - st.abd) / 6.5))));
  for (const L of BF.legs) {
    L.p.setAttribute('transform', `rotate(${F(L.s * st.flail * DEG * (L.ry ? 1 : -.8))} ${L.s * L.rx} ${L.ry})`);
    setA(L.p, 'opacity', F(st.legsOp));
  }
  // antennae straighten from a limp curl
  for (let i = 0; i < 2; i++) {
    const s = i ? 1 : -1; let x = s * 3, y = -34, a = -Math.PI / 2 + s * .3;
    const pts = [[x, y]];
    for (let k = 0; k < 8; k++) { a += s * (1 - st.ant) * (.17 + k * .03); x += Math.cos(a) * 7.4; y += Math.sin(a) * 7.4; pts.push([x, y]); }
    BF.ant[i].setAttribute('d', smoothOpen(pts));
    BF.club[i].setAttribute('transform', `translate(${F(x)} ${F(y)}) rotate(${F(a * DEG + 90)})`);
  }
  const sep = lerp(4.2, 0, st.zip);
  BF.prob[0].setAttribute('transform', `translate(${F(-sep)} -39) scale(-1 1)`);
  BF.prob[1].setAttribute('transform', `translate(${F(sep)} -39)`);
  S.wingPt = bfWorld(st, 'fw', 95, -55);
  S.imagoPt = { x: st.O.x + 12, y: st.O.y - 6 };
}

function renderTwigScene(t, day) {
  const scene = $('twigScene');
  const on = t >= 37.55;
  show(scene, on);
  if (!on) return;
  setA(scene, 'opacity', F(seg(t, 37.6, 38.3) * (1 - seg(t, 78.9, 79.9))));
  // silk pad and glinting strands
  const w = easeInOutSine(seg(t, 39.3, 40.4));
  setA(pad.ell, 'rx', F(16 * w)); setA(pad.ell, 'ry', F(4.5 * w));
  pad.strands.forEach((p, i) => {
    const glint = t < 40.6 ? Math.pow(Math.max(0, Math.sin(t * 5.3 + i * 1.9)), 3) : Math.pow(Math.max(0, Math.sin(t * .9 + i * 1.3)), 6);
    setA(p, 'opacity', F(w * (.25 + .6 * glint)));
  });
  S.padPt = { x: PX + 8, y: PY + 3 };
  // caterpillar → J → skin
  const look = twigLarva(t);
  show(twigRig.g, !!look);
  if (look) {
    drawRig(twigRig, twigPose, look);
    const fall = seg(t, 47.2, 48.4);
    if (fall > 0) {
      const c = twigPose.C[Math.floor(NSEG / 2)];
      twigRig.g.setAttribute('transform', `translate(0 ${F(820 * fall * fall)}) rotate(${F(fall * 160)} ${F(c.x)} ${F(c.y)})`);
    } else setA(twigRig.g, 'transform', '');
    const j = twigPose.C[7];
    S.jPt = { x: j.x + Math.sin(j.a) * j.r, y: j.y - Math.cos(j.a) * j.r };
  }
  renderPupa(t);
  renderButterfly(t);
}

/* =====================================================================
   10. ANNOTATIONS — callouts
   ===================================================================== */
const CALLOUTS = [
  { text: 'egg · 1.2 mm', t0: 5.9, t1: 10.8, off: [92, -118], anchor: () => S.eggAnchor },
  ...INSTARS.map((I, k) => ({ text: I.name, t0: INSTAR_WIN[k][0], t1: INSTAR_WIN[k][1], off: k < 4 ? [80, -134] : [64, -150], anchor: () => S.headPt })),
  { text: 'silk pad', t0: 39.5, t1: 42.4, off: [118, 92], anchor: () => S.padPt },
  { text: 'J-hang', t0: 42.8, t1: 44.5, off: [128, 70], anchor: () => S.jPt },
  { text: 'cremaster', t0: 46.9, t1: 50.6, off: [-132, 74], anchor: () => S.cremPt },
  { text: 'chrysalis', t0: 50.4, t1: 54.4, off: [124, 66], anchor: () => S.chrysPt },
  { text: 'wings expanding', t0: 62.4, t1: 67.9, off: [132, 58], anchor: () => S.wingPt },
  { text: 'imago', t0: 70.5, t1: 72.9, off: [128, -60], anchor: () => S.imagoPt }
];
for (const c of CALLOUTS) {
  c.g = el('g', { display: 'none' }, $('callouts'));
  c.line = el('line', { stroke: PAL.ink, 'stroke-width': .6, 'stroke-linecap': 'round' }, c.g);
  c.label = el('text', { 'font-size': 14, 'font-style': 'italic', fill: PAL.ink, 'fill-opacity': .85, 'text-anchor': c.off[0] < 0 ? 'end' : 'start' }, c.g);
  c.label.textContent = c.text;
}
function renderCallouts(t) {
  for (const c of CALLOUTS) {
    const A = t >= c.t0 && t <= c.t1 ? c.anchor() : null;
    show(c.g, !!A);
    if (!A) continue;
    const draw = easeInOutSine(seg(t, c.t0, c.t0 + .6)), txt = seg(t, c.t0 + .45, c.t0 + .95), out = 1 - seg(t, c.t1 - .5, c.t1);
    const lx = clamp(A.x + c.off[0], c.off[0] < 0 ? 150 : 90, c.off[0] < 0 ? 910 : 836), ly = clamp(A.y + c.off[1], 72, 858);
    const len = Math.hypot(lx - A.x, ly - A.y);
    c.line.setAttribute('x1', F(A.x)); c.line.setAttribute('y1', F(A.y));
    c.line.setAttribute('x2', F(lx)); c.line.setAttribute('y2', F(ly));
    c.line.setAttribute('stroke-dasharray', F(len) + ' ' + F(len + 1));
    c.line.setAttribute('stroke-dashoffset', F(len * (1 - draw)));
    c.label.setAttribute('x', F(lx + (c.off[0] < 0 ? 6 : -6)));
    c.label.setAttribute('y', F(ly + (c.off[1] > 0 ? 16 : -7)));
    setA(c.label, 'opacity', F(txt));
    setA(c.g, 'opacity', F(out));
  }
}

/* =====================================================================
   11. CAMERA, OPENING, FOOTER / HUD
   ===================================================================== */
function renderCamera(t) {
  let fx = FC.x, fy = FC.y, s = 1;
  if (t < 37.6) {
    const push = easeInOutSine(seg(t, 5.6, 13.2)) * (1 - easeInOutSine(seg(t, 13.4, 15.4)));
    const eg = eggToWorld(0, -EGG_H / 2);
    fx = lerp(FC.x, eg[0], .32 * push); fy = lerp(FC.y, eg[1], .32 * push); s = 1 + .08 * push;
    if (t > 14 && S.headPt) fx += (S.headPt.x - 500) * .05 * smoothstep(14.5, 16.5, t);
    fx += 40 * easeInOutSine(seg(t, 36, 37.6));
  } else {
    const a = easeInOutSine(seg(t, 38, 56)), b = easeInOutSine(seg(t, 56, 61)), c = easeInOutSine(seg(t, 70.5, 76));
    fy = lerp(430, 330, a); s = 1 + .06 * a;
    fy = lerp(fy, 420, b); s = lerp(s, 1.03, b);
    fy = lerp(fy, FC.y, c); s = lerp(s, 1, c);
  }
  setA($('cam'), 'transform', `translate(${FC.x} ${FC.y}) scale(${F(s * 1000) / 1000}) translate(${F(-fx)} ${F(-fy)})`);
}

function renderOpening(t) {
  const card = $('titleCard');
  const op = seg(t, .3, 1.5) * (1 - seg(t, 3.0, 3.9));
  setA(card, 'opacity', F(op));
  show(card, op > 0);
  setA($('titleRule'), 'stroke-dashoffset', F(180 * (1 - easeInOutSine(seg(t, .9, 2.0)))));
}

function renderLight(t, day) {
  const f = day - Math.floor(day), light = .5 + .5 * Math.cos(2 * Math.PI * f);
  const ticking = t >= 4 && t < 58;
  setA($('dayLight'), 'opacity', F(ticking ? .13 * light : .07));
  setA($('dayDark'), 'opacity', F(ticking ? .07 * (1 - light) : 0));
}

function setTitle(numEl, titEl, c) {
  const n = c >= 0 ? CHAPTERS[c].numeral + '.' : '', ti = c >= 0 ? CHAPTERS[c].title : '';
  if (numEl.textContent !== n) numEl.textContent = n;
  if (titEl.textContent !== ti) titEl.textContent = ti;
}
function renderFooter(t, day) {
  const c = chapterIndex(t);
  const dt = c >= 0 ? t - CHAPTERS[c].start : t;
  const k = seg(dt, 0, .4), endFade = 1 - seg(t, 79.6, 80);
  setTitle($('numA'), $('titA'), c);
  setTitle($('numB'), $('titB'), c - 1);
  const a = F(k * endFade), b = F((1 - k) * (c >= 1 ? 1 : 0));
  for (const id of ['numA', 'titA']) setA($(id), 'opacity', a);
  for (const id of ['numB', 'titB']) setA($(id), 'opacity', b);
  setA($('ring'), 'stroke-dashoffset', F(56.55 * (1 - t / TOTAL)));
  const dtxt = 'day ' + Math.floor(day + 1e-6);
  if ($('dayT').textContent !== dtxt) $('dayT').textContent = dtxt;
  setA($('dayG'), 'opacity', F(Math.min(seg(t, 0, .7), 1 - seg(t, 79.3, 80))));
  const x = F(48 + 904 * t / TOTAL);
  setA($('scrubFill'), 'x2', x); setA($('scrubKnob'), 'cx', x);
  setA($('pausedT'), 'opacity', playing ? '0' : '0.8');
}

/* =====================================================================
   12. RENDER — the whole frame as a pure function of t
   ===================================================================== */
function render(t) {
  const day = dayAt(t);
  S.t = t;
  S.eggAnchor = S.headPt = S.padPt = S.jPt = S.cremPt = S.chrysPt = S.wingPt = S.imagoPt = null;
  renderLight(t, day);
  renderOpening(t);
  renderLeafScene(t, day);
  renderTwigScene(t, day);
  renderCamera(t);
  renderCallouts(t);
  renderFooter(t, day);
}

/* =====================================================================
   13. CONTROLS — play/pause, chapters, speed, scrubber, chapter menu
   ===================================================================== */
let T = 0, playing = true, speed = 1, dragging = false, lastNow = null, dirty = true;

(function buildScrubAndMenu() {
  for (const C of CHAPTERS) {
    const x = F(48 + 904 * C.start / TOTAL);
    el('line', { x1: x, x2: x, y1: 956.5, y2: 963.5 }, $('scrubTicks'));
  }
  CHAPTERS.forEach((C, i) => {
    const g = el('g', { class: 'mi ui' }, $('menuItems'));
    el('rect', { x: 50, y: 742 + i * 26, width: 202, height: 24, fill: 'transparent' }, g);
    const n = el('text', { x: 62, y: 759 + i * 26, 'font-size': 13 }, g); n.textContent = C.numeral + '.';
    const ti = el('text', { x: 100, y: 759 + i * 26, 'font-size': 15, 'font-style': 'italic' }, g); ti.textContent = C.title;
    g.addEventListener('click', e => { e.stopPropagation(); jump(C.start + .001); toggleMenu(false); });
  });
})();

function jump(t) { T = ((t % TOTAL) + TOTAL) % TOTAL; dirty = true; }
function toggleMenu(on) { show($('menu'), on == null ? $('menu').getAttribute('display') === 'none' : on); }
function stepChapter(dir) {
  const c = chapterIndex(T);
  if (dir > 0) jump(c + 1 < CHAPTERS.length ? CHAPTERS[c + 1].start + .001 : 0);
  else {
    if (c < 0) { jump(CHAPTERS[CHAPTERS.length - 1].start + .001); return; }
    if (T - CHAPTERS[c].start > 1.5) jump(CHAPTERS[c].start + .001);
    else jump(c > 0 ? CHAPTERS[c - 1].start + .001 : 0);
  }
}

$('chapBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
document.addEventListener('click', () => toggleMenu(false));
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playing = !playing; dirty = true; }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepChapter(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepChapter(-1); }
  else if (e.key === '1') speed = .5;
  else if (e.key === '2') speed = 1;
  else if (e.key === '3') speed = 2;
  else if (e.key === 'Escape') toggleMenu(false);
});

const scrub = $('scrub');
function scrubTo(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  jump(clamp((p.x - 48) / 904, 0, .99999) * TOTAL);
}
scrub.addEventListener('pointerdown', e => { dragging = true; scrub.classList.add('drag'); scrub.setPointerCapture(e.pointerId); scrubTo(e); e.stopPropagation(); });
scrub.addEventListener('pointermove', e => { if (dragging) scrubTo(e); });
const endDrag = () => { dragging = false; scrub.classList.remove('drag'); };
scrub.addEventListener('pointerup', endDrag);
scrub.addEventListener('pointercancel', endDrag);
scrub.addEventListener('click', e => e.stopPropagation());

/* reduced motion: hold still on plate II with every annotation showing */
if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { playing = false; T = 25.4; }
/* optional deep link, e.g. index.html?t=62 or ?t=62&paused */
(function () {
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { const v = parseFloat(q.get('t')); if (isFinite(v)) T = ((v % TOTAL) + TOTAL) % TOTAL; }
  if (q.has('paused')) playing = false;
})();

function frame(now) {
  if (lastNow === null) lastNow = now;
  const dt = Math.min(.1, (now - lastNow) / 1000); lastNow = now;
  if (playing && !dragging) { T = (T + dt * speed) % TOTAL; dirty = true; }
  if (dirty) { render(T); dirty = false; }
  requestAnimationFrame(frame);
}
render(T);
requestAnimationFrame(frame);
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <symbol id="folder" viewBox="0 0 18 14"><path d="M1 2.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2h7a1.5 1.5 0 0 1 1.5 1.5v7.5a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1-1.5-1.5z" fill="#f2b84b"/></symbol>
    <symbol id="file" viewBox="0 0 14 18"><path d="M1.5 1h7l4 4v11.5h-11z" fill="#fff" stroke="#8a8f98" stroke-width="1.2" stroke-linejoin="round"/><path d="M8.5 1v4h4" fill="none" stroke="#8a8f98" stroke-width="1.2"/></symbol>
    <symbol id="image" viewBox="0 0 16 14"><rect x="1" y="1" width="14" height="12" rx="2" fill="#dbeafe" stroke="#60a5fa"/><path d="M2 12l4-5 3 3 2-2 4 4z" fill="#60a5fa"/></symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c5cd6"/></marker>
  </defs>
  <rect width="960" height="380" fill="#faf8ff"/>

  <!-- 左：系统文件管理器 -->
  <g transform="translate(40,36)">
    <rect width="330" height="280" rx="10" fill="#fff" stroke="#d6d3e0"/>
    <path d="M0 10a10 10 0 0 1 10-10h310a10 10 0 0 1 10 10v22h-330z" fill="#eceaf3"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/><circle cx="32" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/>
    <text x="175" y="21" text-anchor="middle" font-size="13" fill="#555">资源管理器 / 访达</text>
    <use href="#folder" x="18" y="48" width="18" height="14"/>
    <text x="44" y="60" font-size="15" font-weight="bold" fill="#2b2b33">我的知识库</text>
    <g font-size="14" fill="#2b2b33">
      <use href="#folder" x="42" y="80" width="18" height="14"/><text x="68" y="92" fill="#8a8f98">.obsidian</text><text x="150" y="92" font-size="12" fill="#b0a8c8">← 隐藏：设置、插件、主题</text>
      <use href="#folder" x="42" y="110" width="18" height="14"/><text x="68" y="122">日记</text>
      <use href="#folder" x="42" y="140" width="18" height="14"/><text x="68" y="152">知识</text>
      <use href="#file" x="44" y="167" width="14" height="18"/><text x="68" y="182">欢迎.md</text>
      <use href="#file" x="44" y="197" width="14" height="18"/><text x="68" y="212">番茄工作法.md</text>
      <use href="#image" x="43" y="229" width="16" height="14"/><text x="68" y="242">截图.png</text>
    </g>
  </g>

  <!-- 中间箭头 -->
  <line x1="392" y1="176" x2="568" y2="176" stroke="#7c5cd6" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="480" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b3fc4">同一批文件</text>
  <text x="480" y="202" text-anchor="middle" font-size="13" fill="#6b6780">在 Obsidian 里改</text>
  <text x="480" y="222" text-anchor="middle" font-size="13" fill="#6b6780">＝ 直接改文件夹里的文件</text>

  <!-- 右：Obsidian -->
  <g transform="translate(590,36)">
    <rect width="330" height="280" rx="10" fill="#1e1e1e" stroke="#3a3a3a"/>
    <path d="M0 10a10 10 0 0 1 10-10h310a10 10 0 0 1 10 10v22h-330z" fill="#262626"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/><circle cx="32" cy="16" r="5" fill="#febc2e"/><circle cx="48" cy="16" r="5" fill="#28c840"/>
    <text x="175" y="21" text-anchor="middle" font-size="13" fill="#aaa">Obsidian</text>
    <path d="M0 32h130v238a10 10 0 0 1-10 10h-120z" fill="#262626"/>
    <g font-size="13" fill="#dcddde">
      <text x="12" y="56" font-weight="bold" font-size="12" fill="#a88bfa">我的知识库</text>
      <text x="12" y="82">▸ 日记</text>
      <text x="12" y="106">▸ 知识</text>
      <text x="24" y="130">欢迎</text>
      <rect x="6" y="140" width="118" height="22" rx="4" fill="#3b3456"/>
      <text x="24" y="156" fill="#fff">番茄工作法</text>
      <text x="24" y="182" fill="#9a9a9a">截图.png</text>
    </g>
    <text x="150" y="70" font-size="19" font-weight="bold" fill="#e8e8e8">番茄工作法</text>
    <rect x="150" y="88" width="160" height="7" rx="3" fill="#4a4a4a"/>
    <rect x="150" y="104" width="130" height="7" rx="3" fill="#4a4a4a"/>
    <rect x="150" y="120" width="150" height="7" rx="3" fill="#4a4a4a"/>
    <rect x="150" y="146" width="70" height="7" rx="3" fill="#a88bfa"/>
    <rect x="226" y="146" width="80" height="7" rx="3" fill="#4a4a4a"/>
    <rect x="150" y="162" width="110" height="7" rx="3" fill="#4a4a4a"/>
  </g>

  <text x="480" y="352" text-anchor="middle" font-size="16" fill="#2b2b33">仓库（Vault）就是电脑上的<tspan font-weight="bold" fill="#5b3fc4">一个普通文件夹</tspan>：笔记是 .md 纯文本文件，图片等附件原样存放。</text>
</svg>
